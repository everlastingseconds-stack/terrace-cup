<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrace Cup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--bg:#000;--panel:#111;--line:#2e2418;--red:#d1122f;--red2:#ff3a55;--gold:#d9a521;--gold2:#f3cf6b;--text:#f4ede0;--muted:#a69a85;--ok:#3fbf7f;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:#000}
body{margin:0;color:var(--text);font:15px/1.5 Barlow,system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;margin:0 0 8px}
h2{font-size:30px;color:var(--gold2)}h3{font-size:21px}
header{background:linear-gradient(180deg,#1b0207,#000);border-bottom:2px solid var(--gold);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{font:700 32px "Barlow Condensed",Impact,sans-serif;color:var(--gold2)}.logo b{color:var(--red2)}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}.ctl select{width:auto}
select,input,textarea{background:#0a0a0a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold)}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:#0a0a0a;padding:0 8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:13px 14px;margin:0;border-radius:0;white-space:nowrap}
nav button.on{color:var(--gold2);border-color:var(--red)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:600 15px Barlow,sans-serif;cursor:pointer;margin-top:12px}
button.g{background:var(--gold);color:#000}button.o{background:none;border:1px solid var(--gold);color:var(--gold2)}button.s{padding:6px 12px;font-size:13px;margin:0 6px 0 0}
.m{color:var(--muted)}.gold{color:var(--gold2);font:700 26px "Barlow Condensed",sans-serif}
.note{background:#241a05;border:1px solid var(--gold);color:var(--gold2);padding:10px 14px;border-radius:6px;margin-bottom:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pending{background:#3a2d08;color:var(--gold2)}.verified{background:#0f2e1f;color:var(--ok)}.rejected{background:#3a0a12;color:var(--red2)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--gold)}
.wrap{overflow-x:auto}summary{cursor:pointer;color:var(--gold2);font-weight:600}a{color:var(--gold2)}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.stats .card{margin:0;text-align:center}
.ph{height:170px;width:100%;object-fit:cover;border-radius:8px;border:1px solid var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 18px;border-radius:6px;font-weight:600;display:none;z-index:9}
.av{border-radius:50%;object-fit:cover;background:#1a1a1a;border:2px solid var(--gold);flex:none}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:8px;margin:0;padding:8px 10px;background:#0a0a0a;border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:15px;cursor:pointer}
.ck input{width:auto;accent-color:var(--red)}
.sub{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}.sub button{margin:0;background:none;border:1px solid var(--line);color:var(--text)}.sub button.on{background:var(--gold);border-color:var(--gold);color:#000}
.tls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tl{background:#0a0a0a;border:1px solid var(--line);border-radius:6px;padding:10px}.tl.full{border-color:var(--gold)}
.th{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.st div{background:#171717;border-radius:4px;padding:4px 8px}.st span{display:block;font-size:11px;color:var(--muted)}.st b{color:var(--gold2);font-size:17px}
.sq{max-height:90px;overflow:auto;font-size:13px}.sq div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.pool{max-height:300px;overflow:auto}.pr{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}.pr.cur{background:#2a0a10;border-left:3px solid var(--red)}
.stage{text-align:center;max-width:640px;margin:0 auto 14px}.stage .pn{font:700 38px "Barlow Condensed",sans-serif;color:var(--gold2)}
.stage .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-top:8px}.stage .full{grid-column:1/-1;text-align:center}
.bidrow{display:flex;gap:8px}.bidrow button{margin:0;white-space:nowrap}
@media(max-width:600px){.stage .row{grid-template-columns:1fr}}
.br{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.rdw{display:flex;flex-direction:column;min-width:210px}.rdw h4{margin:0 0 8px;color:var(--gold2);font:700 17px "Barlow Condensed",sans-serif;text-align:center}
.rd{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1}
.mt{background:#0a0a0a;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;font-size:14px}
.mt div{padding:6px 10px;border-bottom:1px solid var(--line)}.mt div:last-child{border:0}.mt .n{font-size:11px;color:var(--muted);background:#151515}
.tm{font-size:11px;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:6px;white-space:nowrap}
#drCount{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;text-align:center;z-index:50}
#drCount .m{font:600 28px "Barlow Condensed",sans-serif;letter-spacing:.06em}
#drCount .big{font:700 min(48vw,260px) "Barlow Condensed",Impact,sans-serif;line-height:1;color:var(--gold2);text-shadow:0 0 40px var(--red);animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(1.7);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.88);opacity:.55}}
.spot{text-align:center;border-left-color:var(--gold);animation:flash 1s}
.spot .pn{font:700 clamp(32px,7vw,56px) "Barlow Condensed",sans-serif;color:var(--gold2)}
.q{color:var(--muted);letter-spacing:.25em}
.hl{background:var(--red);color:#fff;padding:1px 8px;border-radius:4px;animation:flash 1s}
@keyframes flash{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#drCount .big,.spot,.hl{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

        :host {
          display: block;
          --court-navy: #0a0a0a;
          --court-navy-light: #111111;
          --court-navy-lighter: #2e2418;
          --line-white: #f4ede0;
          --ball-yellow: #d9a521;
          --live-orange: #ff3a55;
          --slate-mid: #a69a85;
          --win-green: #3fbf7f;
        }
        .app-root {
          background: transparent;
          color: var(--line-white);
          font-family: 'Inter', sans-serif;
          min-height: 40vh;
          padding: 0;
        }
        .app-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 20px 24px 12px;
          border-bottom: 1px solid var(--court-navy-lighter);
          flex-wrap: wrap;
          gap: 12px;
        }
        .header-titles { display: flex; flex-direction: column; gap: 4px; }
        .terrace-banner {
          font-family: 'Titan One', 'Bebas Neue', sans-serif;
          font-weight: 400;
          font-size: 34px;
          letter-spacing: 1px;
          text-transform: uppercase;
          font-style: italic;
          transform: skewX(-8deg);
          color: #FF1E1E;
          -webkit-text-stroke: 1px #0A0A0A;
          text-shadow: 3px 3px 0 rgba(0,0,0,0.6), 0 0 18px rgba(255,30,30,0.4);
          width: fit-content;
          line-height: 1;
        }
        .terrace-banner .cup-red { color: #FF1E1E; }
        .brand {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 18px;
          letter-spacing: 1px;
          color: var(--ball-yellow);
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .brand .court-lines {
          width: 16px; height: 16px;
          border: 2px solid var(--ball-yellow);
          border-radius: 3px;
          position: relative;
          flex-shrink: 0;
        }
        .brand .court-lines::before {
          content: '';
          position: absolute; left: 50%; top: 2px; bottom: 2px;
          width: 2px; background: var(--ball-yellow); transform: translateX(-50%);
        }
        .save-indicator {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 11px;
          color: var(--slate-mid);
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
        .event-selector-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 14px 24px;
          flex-wrap: wrap;
        }
        .event-selector-row .select-input { min-width: 220px; }
        .back-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: none; color: var(--slate-mid);
          font-size: 13px; cursor: pointer; padding: 4px 0;
        }
        .back-btn:hover { color: var(--line-white); }
        .tab-bar {
          display: flex;
          gap: 4px;
          padding: 0 24px;
          border-bottom: 1px solid var(--court-navy-lighter);
          overflow-x: auto;
        }
        .tab-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: none; color: var(--slate-mid);
          font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
          padding: 12px 14px; cursor: pointer; white-space: nowrap;
          border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--ball-yellow); border-bottom-color: var(--ball-yellow); }
        .tab-btn:hover:not(.active) { color: var(--line-white); }
        .main-content { padding: 20px 24px 60px; max-width: 980px; margin: 0 auto; }
        .panel { background: var(--court-navy-light); border: 1px solid var(--court-navy-lighter); border-radius: 10px; padding: 22px; }
        .panel-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.5px; margin: 0 0 14px; color: var(--line-white); }
        .panel-subtitle { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.5px; margin: 0 0 10px; color: var(--slate-mid); }
        .panel-head-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
        .muted { color: var(--slate-mid); font-size: 13px; }
        .muted.small { font-size: 12px; margin-top: -4px; margin-bottom: 14px; }
        .small-label { font-size: 12px; }
        .divider { height: 1px; background: var(--court-navy-lighter); margin: 18px 0; }

        .form-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        .form-row.wrap { flex-wrap: wrap; }
        .text-input, .select-input {
          background: var(--court-navy); border: 1px solid var(--court-navy-lighter);
          color: var(--line-white); padding: 8px 10px; border-radius: 6px; font-size: 13px;
          font-family: 'Inter', sans-serif;
        }
        .text-input:focus, .select-input:focus { outline: none; border-color: var(--ball-yellow); }
        .text-input { flex: 1; min-width: 120px; }
        .text-input.narrow { width: 60px; flex: none; }
        .select-input.full { width: 100%; margin-top: 8px; }

        .primary-btn {
          display: flex; align-items: center; gap: 6px;
          background: var(--ball-yellow); color: var(--court-navy);
          border: none; padding: 8px 14px; border-radius: 6px;
          font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .primary-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .primary-btn:hover:not(:disabled) { filter: brightness(1.08); }
        .ghost-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: 1px solid var(--slate-mid); color: var(--line-white);
          padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
        }
        .ghost-btn:hover { border-color: var(--ball-yellow); color: var(--ball-yellow); }
        .ghost-btn.active { background: var(--ball-yellow); border-color: var(--ball-yellow); color: var(--court-navy); font-weight: 700; }
        .shootout-picker { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; padding: 10px; background: rgba(255,106,61,0.08); border: 1px dashed var(--live-orange); border-radius: 8px; }
        .icon-btn { background: none; border: none; color: var(--slate-mid); cursor: pointer; padding: 4px; display: flex; }
        .icon-btn:hover { color: var(--live-orange); }
        .icon-btn.small { padding: 2px; }

        .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .chip {
          background: var(--court-navy); border: 1px solid var(--court-navy-lighter);
          padding: 5px 8px 5px 12px; border-radius: 20px; font-size: 13px;
          display: flex; align-items: center; gap: 6px;
        }
        .chip-x { background: none; border: none; color: var(--slate-mid); cursor: pointer; display: flex; }
        .chip-x:hover { color: var(--live-orange); }
        .chip-sub { color: var(--slate-mid); font-size: 11.5px; }
        .chip-num {
          background: var(--ball-yellow); color: var(--court-navy); font-weight: 800; font-size: 10.5px;
          width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        }
        button.toggle-chip { cursor: pointer; font-family: inherit; color: var(--line-white); }
        button.toggle-chip.active { background: var(--ball-yellow); border-color: var(--ball-yellow); color: var(--court-navy); font-weight: 600; }

        .event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 8px; }
        .event-card { background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 8px; padding: 14px; cursor: pointer; }
        .event-card:hover { border-color: var(--slate-mid); }
        .event-card.active { border-color: var(--ball-yellow); }
        .event-card-top { display: flex; justify-content: space-between; align-items: center; }
        .sport-emoji { font-size: 20px; }
        .event-card-name { font-weight: 700; margin-top: 6px; }
        .event-card-meta { font-size: 12px; color: var(--slate-mid); margin-top: 2px; }

        .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 12px; }
        .group-card { background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 8px; padding: 12px; }
        .group-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .divider.thin { margin: 10px 0; }
        .skip-matrix-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .ghost-btn.tiny { padding: 4px 9px; font-size: 11.5px; gap: 4px; }
        .skip-matrix-scroll { overflow-x: auto; padding-bottom: 4px; }
        .skip-matrix { border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; }
        .skip-matrix th, .skip-matrix td { padding: 2px; text-align: center; }
        .skip-matrix thead th {
          color: var(--slate-mid); font-size: 10.5px; font-weight: 700; min-width: 24px;
        }
        .skip-matrix tbody th {
          color: var(--slate-mid); font-size: 10.5px; font-weight: 700; padding-right: 6px; text-align: right;
        }
        .skip-cell {

<script>

const SB_URL = "https://brtdpkfpvwcldujnusnl.supabase.co";
const SB_KEY = "sb_publishable_Es5DPHPDs5xFYZsCbADtGg_0BDMvOm3";

const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const E = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R = n => "₹" + Number(n).toLocaleString("en-IN");
const S = {user:null, role:"viewer", player:null, eds:[], ed:null, tab:"reg", mode:"in", otp:"email", email:"", msg:""};
const isAdm = () => S.role !== "viewer";
const live = () => S.ed && S.ed.is_active;
const pub = p => sb.storage.from("public-assets").getPublicUrl(p).data.publicUrl;
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2800)}
const chk = r => { if(r.error){toast(r.error.message);return false} return true };

const SPORTS=["Cricket","Football","Pickleball","Badminton","Chess","Table tennis","Darts","Carrom"];
const avatar=(p,sz=44)=>p?`<img class="av" style="width:${sz}px;height:${sz}px" src="${sb.storage.from("player-photos").getPublicUrl(p).data.publicUrl}" alt="">`:`<div class="av" style="width:${sz}px;height:${sz}px"></div>`;
function shrink(file,max=900){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("Could not read the photo")),"image/jpeg",.85)};
  img.onerror=()=>rej(new Error("Could not read the photo. Try a JPG or PNG."));img.src=u})}
const TABS=[["reg","Player registration"],["ev","Event registration"],["auc","Auction"],["draw","Draw"],["score","Scoring"],["part","Participants"],["mem","Members"],["bud","Budget"],["gal","Gallery"],["fb","Feedback"]];
const soon=(t,n)=>`<h2>${t}</h2><div class="note">${n}</div>`;

// ---------- data loading ----------
async function load(){
  const {data:{user}}=await sb.auth.getUser();
  S.user=user; if(!user) return render();
  const [p,e,pl]=await Promise.all([
    sb.from("profiles").select("role").eq("id",user.id).single(),
    sb.from("editions").select("*").order("year",{ascending:false}),
    sb.from("players").select("*").eq("user_id",user.id).maybeSingle()]);
  S.role=p.data?.role||"viewer"; S.eds=e.data||[]; S.player=pl.data;
  let saved=null; try{saved=+localStorage.getItem("tc_ed")}catch{}
  S.ed=S.eds.find(x=>x.id===saved)||S.eds.find(x=>x.is_active)||S.eds[0]||null;
  if(S.tab==="reg"&&S.player) S.tab="ev";
  render();
}

// ---------- rendering ----------
async function render(){
  const app=$("#app");
  if(!S.user){app.innerHTML=loginHTML();return}
  if(!S.player) S.tab="reg";
  app.innerHTML=`<header><div class="logo">Terrace <b>Cup</b></div><div class="ctl">
    <select data-chg="ed">${S.eds.map(x=>`<option value="${x.id}" ${S.ed&&x.id===S.ed.id?"selected":""}>${E(x.name)}${x.is_active?" (live)":" (archive)"}</option>`).join("")}</select>
    <span>${E(S.user.email)} · ${S.role==="super"?"Super admin":S.role==="admin"?"Admin":"Viewer"}</span>
    <button class="s o" data-act="out">Sign out</button></div></header>
    ${S.player?`<nav>${TABS.filter(t=>t[0]!=="mem"||isAdm()).map(t=>`<button data-tab="${t[0]}" class="${t[0]===S.tab?"on":""}">${t[1]}</button>`).join("")}</nav>`:""}
    <main id="main"><p class="m">Loading…</p></main>`;
  let h; try{h=await V[S.tab]()}catch(err){h=`<div class="note">${E(err.message)}</div>`}
  const m=$("#main"); if(m) m.innerHTML=h;
  const sl=$("#scSlot"); if(sl) scAttach(sl);
}

function loginHTML(){
  const t={in:"Sign in",up:"Create account",code:"Sign in with email code",verify:"Enter your code"}[S.mode];
  const btn={in:"Sign in",up:"Create account",code:"Email me a code",verify:"Verify and continue"}[S.mode];
  const link=(m,l)=>`<a href="#" data-mode="${m}">${l}</a>`;
  return `<div class="login"><div class="logo" style="text-align:center;margin-bottom:16px">Terrace <b>Cup</b></div>
  <form class="card" data-f="login"><h3>${t}</h3>${S.msg?`<div class="note">${E(S.msg)}</div>`:""}
  <label>Email</label><input name="email" type="email" required value="${E(S.email)}" ${S.mode==="verify"?"readonly":""}>
  ${S.mode==="in"||S.mode==="up"?`<label>Password</label><input name="pw" type="password" required minlength="6">`:""}
  ${S.mode==="verify"?`<label>6-digit code from your email</label><input name="otp" inputmode="numeric" required>`:""}
  <button style="width:100%">${btn}</button>
  ${S.mode!=="verify"?`<button type="button" class="g" style="width:100%" data-act="google">Continue with Google</button>`:""}
  <p class="m" style="margin-top:16px">${[S.mode!=="in"&&link("in","Sign in with password"),S.mode!=="up"&&link("up","Create account"),S.mode!=="code"&&S.mode!=="verify"&&link("code","Email me a code")].filter(Boolean).join(" · ")}</p></form></div>`;
}

// ---------- views ----------
const V={};
V.reg=async()=>{
  const p=S.player||{}, first=!S.player, mine=p.sports||[];
  return `<h2>${first?"Welcome! Complete your registration":"Your player profile"}</h2>
<p class="m">${first?"This is a one-time sign-up. Your profile carries over to every Terrace Cup edition.":"Update your details any time."}</p>
<form class="card" data-f="player">
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${avatar(p.photo_path,96)}
<div style="flex:1;min-width:220px"><label>Close-up photo ${first?"(required)":"(leave empty to keep your current one)"}</label><input type="file" name="photo" accept="image/*" ${first?"required":""}></div></div>
<div class="g2">
<div><label>First name</label><input name="first_name" required value="${E(p.first_name)}"></div>
<div><label>Last name</label><input name="last_name" required value="${E(p.last_name)}"></div>
<div><label>Email ID</label><input name="email" type="email" required value="${E(p.email||S.user.email)}"></div>
<div><label>Phone number</label><input name="phone" type="tel" required pattern="[0-9+ \\-]{10,15}" title="10 to 15 digits" value="${E(p.phone)}"></div></div>
<label>Sports you are interested in</label>
<div class="chk">${SPORTS.map(s=>`<label class="ck"><input type="checkbox" name="sports" value="${s}" ${mine.includes(s)?"checked":""}> ${s}</label>`).join("")}</div>
<label>Other sports you would like us to add (optional)</label>
<textarea name="other_sports" rows="2" placeholder="e.g. Volleyball, Carrom doubles">${E(p.other_sports)}</textarea>
<button>${first?"Complete registration":"Save changes"}</button></form>`;
};

V.ev=async()=>{
  if(!S.ed) return `<p class="m">No edition has been created yet.</p>`;
  if(!S.player){S.tab="reg";return V.reg()}
  const [ev,mine]=await Promise.all([
    sb.from("events").select("*").eq("edition_id",S.ed.id).order("id"),
    sb.from("registrations").select("event_id,status").eq("player_id",S.player.id)]);
  const st=new Map((mine.data||[]).map(r=>[r.event_id,r.status]));
  const qr=S.ed.qr_path?pub(S.ed.qr_path):null;

// ---------- scoring (Courtside) ----------
// The scoring UI is a React app bundled above (CourtsideScoring). It lives in a shadow root and talks to
// Supabase only through this bridge: one row per scoring event in public.score_events (see scoring.sql).
const SC={ed:null,events:[],dirty:new Set(),gone:new Set(),canEdit:false,status:"idle",err:"",subs:new Set(),timer:0,ch:null,host:null,loading:null};
SC.emit=()=>SC.subs.forEach(f=>f());
SC.bridge={
  subscribe:f=>{SC.subs.add(f);return()=>SC.subs.delete(f)},
  getEvents:()=>SC.events, getCanEdit:()=>SC.canEdit, getStatus:()=>SC.status,
  setEvents(u){
    if(!SC.canEdit)return;
    const prev=SC.events,next=typeof u==="function"?u(prev):u;if(next===prev)return;
    const pm=new Map(prev.map(e=>[e.id,e])),nm=new Set(next.map(e=>e.id));
    next.forEach(e=>{if(pm.get(e.id)!==e){SC.dirty.add(e.id);SC.gone.delete(e.id)}});
    prev.forEach(e=>{if(!nm.has(e.id)){SC.gone.add(e.id);SC.dirty.delete(e.id)}});
    SC.events=next;SC.status="saving";SC.emit();clearTimeout(SC.timer);SC.timer=setTimeout(scFlush,500)}
};
SC.bridge.listImports=async()=>{
  const ed=SC.ed;if(!ed)return [];
  const ev=await sb.from("events").select("id,name").eq("edition_id",ed.id).order("id");
  if(ev.error)throw ev.error;
  const evs=ev.data||[],ids=evs.map(e=>e.id);if(!ids.length)return [];
  const [d,a,p]=await Promise.all([
    sb.from("draws").select("event_id,state").in("event_id",ids),
    sb.from("auctions").select("event_id,state").in("event_id",ids),
    sb.from("participants").select("event_id,full_name").in("event_id",ids).eq("status","verified")]);
  return evs.map(e=>{
    const res=((d.data||[]).find(x=>x.event_id===e.id)||{}).state?.result;
    const draw=res&&res.revealed!==false&&(res.rounds||res.groups)?res:null;
    const teams=(((a.data||[]).find(x=>x.event_id===e.id)||{}).state?.teams||[]).filter(t=>t.captain||(t.squad||[]).length);
    return {id:e.id,name:e.name,draw,
      auction:teams.map(t=>({name:t.name,captain:t.captain||"",squad:(t.squad||[]).map(s=>s.name)})),
      players:(p.data||[]).filter(x=>x.event_id===e.id).map(x=>x.full_name).filter(Boolean)};
  });
};
async function scFlush(){
  const ed=SC.ed;if(!ed||!S.user)return;
  const now=new Date().toISOString();
  const up=SC.events.filter(e=>SC.dirty.has(e.id)).map(e=>({id:e.id,edition_id:ed.id,data:e,updated_by:S.user.id,updated_at:now}));
  const del=[...SC.gone];SC.dirty.clear();SC.gone.clear();
  let ok=true;
  if(up.length){const r=await sb.from("score_events").upsert(up);if(r.error){ok=false;up.forEach(u=>SC.dirty.add(u.id));toast(r.error.message)}}
  if(del.length){const r=await sb.from("score_events").delete().in("id",del).eq("edition_id",ed.id);if(r.error){ok=false;del.forEach(id=>SC.gone.add(id));toast(r.error.message)}}
  SC.status=ok?"saved":"error";SC.emit();
  if(!ok){clearTimeout(SC.timer);SC.timer=setTimeout(scFlush,5000)}
}
async function scSettle(){if(SC.dirty.size||SC.gone.size){clearTimeout(SC.timer);await scFlush()}}
function scRemote(p){
  const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.id)return;
  if(SC.dirty.has(row.id))return; // our unsaved edit wins; it will overwrite on the next flush
  if(p.eventType==="DELETE"){SC.events=SC.events.filter(e=>e.id!==row.id);SC.emit();return}
  const cur=SC.events.find(e=>e.id===row.id);
  if(cur&&JSON.stringify(cur)===JSON.stringify(row.data))return; // echo of our own save
  SC.events=cur?SC.events.map(e=>e.id===row.id?row.data:e):[...SC.events,row.data];SC.emit();
}
async function scLoad(){
  while(SC.loading)await SC.loading;
  const ed=S.ed;SC.canEdit=isAdm()&&!!ed&&!!ed.is_active;
  if(SC.ed&&SC.ed.id===ed.id){SC.ed=ed;SC.emit();return}
  SC.loading=(async()=>{
    await scSettle();
    if(SC.ch){sb.removeChannel(SC.ch);SC.ch=null}
    SC.ed=ed;SC.events=[];SC.status="idle";SC.err="";
    const r=await sb.from("score_events").select("id,data").eq("edition_id",ed.id).order("created_at").order("id");
    if(r.error){SC.err=r.error.message;SC.ed=null}
    else{
      SC.events=(r.data||[]).map(x=>x.data);
      SC.ch=sb.channel("score-"+ed.id).on("postgres_changes",{event:"*",schema:"public",table:"score_events",filter:"edition_id=eq."+ed.id},scRemote).subscribe();
    }
    SC.emit();
  })();
  try{await SC.loading}finally{SC.loading=null}
}
async function scReset(){
  await scSettle();
  if(SC.ch){sb.removeChannel(SC.ch);SC.ch=null}
  SC.ed=null;SC.events=[];SC.canEdit=false;SC.status="idle";SC.emit();
  if(SC.host&&SC.host.parentNode)SC.host.remove();
}
function scAttach(slot){
  if(!SC.host)SC.host=CourtsideScoring.mountScoring(SC.bridge);
  if(SC.host.parentNode!==slot)slot.appendChild(SC.host);
}
V.score=async()=>{
  if(!S.ed)return `<h2>Scoring</h2><p class="m">No edition yet.</p>`;
  await scLoad();
  if(SC.err)return `<h2>Scoring</h2><div class="note">Scoring is not set up yet (${E(SC.err)}). Run scoring.sql in the Supabase SQL editor, then reload.</div>`;

const upload=async(bucket,path,file)=>sb.storage.from(bucket).upload(path,file);
const safe=n=>n.replace(/[^\w.-]/g,"_");
const F={
  async login(fd){
    const email=fd.get("email").trim(); S.email=email; S.msg="";
    if(S.mode==="in"){const r=await sb.auth.signInWithPassword({email,password:fd.get("pw")});if(r.error)S.msg=r.error.message;else return load()}
    else if(S.mode==="up"){const r=await sb.auth.signUp({email,password:fd.get("pw")});if(r.error)S.msg=r.error.message;else{S.mode="verify";S.otp="signup";S.msg="We emailed you a 6-digit code. Enter it below."}}
    else if(S.mode==="code"){const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(r.error)S.msg=r.error.message;else{S.mode="verify";S.otp="email";S.msg="We emailed you a 6-digit code. Enter it below."}}
    else{const r=await sb.auth.verifyOtp({email,token:fd.get("otp").trim(),type:S.otp});if(r.error)S.msg=r.error.message;else return load()}
    render();
  },
  async player(fd){
    const sports=fd.getAll("sports");
    if(!sports.length) return toast("Pick at least one sport");
    let photo_path=S.player?.photo_path||null; const f=fd.get("photo");
    if(f&&f.size){
      const blob=await shrink(f), path=`${S.user.id}/avatar-${Date.now()}.jpg`;
      if(!chk(await sb.storage.from("player-photos").upload(path,blob,{contentType:"image/jpeg"}))) return;
      if(photo_path) sb.storage.from("player-photos").remove([photo_path]);
      photo_path=path;
    }
    if(!photo_path) return toast("Please add a close-up photo");
    const first=fd.get("first_name").trim(), last=fd.get("last_name").trim();
    const r=await sb.from("players").upsert({user_id:S.user.id,first_name:first,last_name:last,full_name:first+" "+last,email:fd.get("email").trim(),phone:fd.get("phone").trim(),sports,other_sports:fd.get("other_sports").trim()||null,photo_path},{onConflict:"user_id"});
    if(chk(r)){toast("Registration saved");S.tab="ev";await load()}
  },
  async reg(fd){
    let proof=null; const f=fd.get("proof");
    if(f&&f.size){proof=`${S.user.id}/${Date.now()}-${safe(f.name)}`;if(!chk(await upload("payment-proofs",proof,f)))return}
    const r=await sb.from("registrations").insert({event_id:+fd.get("event_id"),player_id:S.player.id,utr:fd.get("utr").trim(),proof_path:proof});
    if(r.error){toast(r.error.code==="23505"?"This transaction ID or event entry already exists.":r.error.message);return}
    toast("Submitted. Waiting for admin check");render();
  },
  async event(fd){if(chk(await sb.from("events").insert({edition_id:S.ed.id,name:fd.get("name").trim(),fee:+fd.get("fee")||0})))render()},
  async qr(fd){
    const f=fd.get("qr"),path=`qr/${S.ed.id}-${Date.now()}.png`;
    if(!chk(await upload("public-assets",path,f)))return;
    if(chk(await sb.from("editions").update({qr_path:path}).eq("id",S.ed.id))){S.ed.qr_path=path;toast("QR saved");render()}
  },
  async exp(fd){if(chk(await sb.from("expenses").insert({edition_id:S.ed.id,event_id:+fd.get("event_id")||null,head:fd.get("head"),description:fd.get("description").trim(),amount:+fd.get("amount"),created_by:S.user.id})))render()},
  async photo(fd){
    const f=fd.get("file"),path=`gallery/${S.ed.id}/${Date.now()}-${safe(f.name)}`;
    if(!chk(await upload("public-assets",path,f)))return;

const DR={ev:null,st:null};
const drNew=()=>({input:"",cfg:{format:"ko",same:"no",groups:2,advance:2},result:null});

const sl=p=>({name:p.name,team:p.team||""});
function drParse(txt){return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(",");return i<0?{name:l,team:""}:{name:l.slice(0,i).trim(),team:l.slice(i+1).trim()}}).filter(p=>p.name)}
// pair a list (even length) at random; when avoid is true, keep teammates apart where possible
function drPair(list,avoid){
  const bad=ps=>ps.filter(p=>tk(p[0])&&tk(p[0])===tk(p[1])).length, mk=a=>{const x=[];for(let i=0;i<a.length;i+=2)x.push([a[i],a[i+1]]);return x};
  if(!avoid){const p=mk(shuf(list));return{pairs:p,bad:bad(p)}}
  for(let t=0;t<60;t++){const p=mk(shuf(list));if(!bad(p))return{pairs:p,bad:0}}
  // greedy: always pair a player from the biggest remaining team with one from another team
  let pool=shuf(list),pairs=[];
  while(pool.length){const c={};pool.forEach(p=>{if(tk(p))c[tk(p)]=(c[tk(p)]||0)+1});
    pool.sort((x,y)=>(c[tk(y)]||0)-(c[tk(x)]||0));const a=pool.shift();
    let j=pool.findIndex(p=>!tk(a)||tk(p)!==tk(a));if(j<0)j=0;pairs.push([a,pool.splice(j,1)[0]])}
  return{pairs,bad:bad(pairs)};
}
function drKO(players,avoid){
  const n=players.length,size=1<<Math.ceil(Math.log2(n)),b=size-n,mc=size/2;let best=null;
  for(let t=0;t<150;t++){const sh=shuf(players),o=drPair(sh.slice(b),avoid);
    if(!best||o.bad<best.bad)best={byeP:sh.slice(0,b),pairs:o.pairs,bad:o.bad};if(!best.bad||!avoid)break}
  const idx=shuf([...Array(mc).keys()]),r1=Array(mc);
  idx.slice(0,b).forEach((m,i)=>r1[m]=[sl(best.byeP[i]),{bye:true}]);
  idx.slice(b).forEach((m,i)=>r1[m]=[sl(best.pairs[i][0]),sl(best.pairs[i][1])]);
  return{r1,bad:best.bad};

function drGroups(players,g,avoid){
  const cap=Math.ceil(players.length/g),G=Array.from({length:g},()=>[]);let order=shuf(players);
  if(avoid){const c={};order.forEach(p=>{if(tk(p))c[tk(p)]=(c[tk(p)]||0)+1});order.sort((x,y)=>(c[tk(y)]||0)-(c[tk(x)]||0))}
  order.forEach(p=>{const t=tk(p),o=G.map((m,i)=>({i,size:m.length,same:t?m.filter(q=>tk(q)===t).length:0})).filter(x=>x.size<cap);
    o.sort((a,b)=>avoid?(a.same-b.same||a.size-b.size||Math.random()-.5):(a.size-b.size||Math.random()-.5));G[o[0].i].push(p)});
  let bad=0;G.forEach(m=>{const s=new Set();m.forEach(p=>{if(tk(p)){if(s.has(tk(p)))bad++;s.add(tk(p))}})});
  return{groups:G.map(shuf),bad};

function drRR(list){ // circle method: every player meets every other once
  const a=list.slice();if(a.length%2)a.push(null);const m=a.length,rounds=[];
  for(let r=0;r<m-1;r++){const ms=[];for(let i=0;i<m/2;i++){const x=a[i],y=a[m-1-i];if(x&&y)ms.push([x,y])}rounds.push(ms);a.splice(1,0,a.pop())}
  return rounds;
}
function drFix(pairs){ // keep players from the same group apart in the knockout's first round
  const same=p=>p[0].g&&p[1].g&&p[0].g===p[1].g;
  for(let pass=0;pass<5;pass++)pairs.forEach((p,i)=>{if(!same(p))return;
    for(let j=0;j<pairs.length&&same(p);j++){if(j===i)continue;const q=pairs[j];
      for(const k of [0,1]){const x=p[1],y=q[k],np=[p[0],y],nq=q.slice();nq[k]=x;if(!same(np)&&!same(nq)){p[1]=y;q[k]=x;break}}}});
}
function drKOGroups(groups,q){
  const seeds=[];for(let t=1;t<=q;t++)groups.forEach(g=>seeds.push({label:t===1?"Winner "+g.name:t===2?"Runner-up "+g.name:`${t}th in ${g.name}`,g:g.name}));
  const Q=seeds.length,size=1<<Math.ceil(Math.log2(Q));let ord=[1];while(ord.length<size){const n=ord.length*2;ord=ord.flatMap(s=>[s,n+1-s])}

function pdfBracket(doc,rounds,x0,y0,bw,gx,pitch){
  const rowH=6,boxH=rowH*2,cy=[rounds[0].map((_,i)=>y0+i*pitch+pitch/2)];
  for(let k=1;k<rounds.length;k++)cy.push(rounds[k].map((_,j)=>(cy[k-1][2*j]+cy[k-1][2*j+1])/2));
  rounds.forEach((rd,k)=>{
    const x=x0+k*(bw+gx);
    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(209,18,47);doc.text(rname(rd.length),x+bw/2,y0-4,{align:"center"});
    rd.forEach((m,j)=>{
      const c=cy[k][j],top=c-boxH/2;
      doc.setDrawColor(120,120,120);doc.setLineWidth(.25);doc.rect(x,top,bw,boxH);doc.line(x,c,x+bw,c);
      doc.setFillColor(209,18,47);doc.rect(x,top,1.2,boxH,"F");
      doc.setFont("helvetica","normal");doc.setFontSize(6);doc.setTextColor(140,140,140);doc.text("M"+(j+1),x+bw-1,top-.8,{align:"right"});
      pdfSlot(doc,m.a,x+3,top,bw-4.5,rowH);pdfSlot(doc,m.b,x+3,top+rowH,bw-4.5,rowH);
      if(k<rounds.length-1){const mx=x+bw+gx/2;doc.setDrawColor(150,150,150);doc.line(x+bw,c,mx,c);
        if(j%2===0){const c2=cy[k][j+1];doc.line(mx,c,mx,c2);doc.line(mx,(c+c2)/2,x+bw+gx,(c+c2)/2)}}
    });
  });
}
function drPdf(items){

    const real=R.flat().filter(m=>!m.a.bye&&!m.b.bye).length,gm=(r.groups||[]).reduce((a,g)=>a+g.fixtures.flat().length,0);
    const sum=`${r.format==="ko"?"Knockout":"Round robin + knockout"} | ${r.players.length} players | ${gm?gm+" group matches, ":""}${real} knockout matches | Teammates in round 1: ${r.same==="yes"?"allowed":"not allowed"} | Drawn ${new Date(r.created).toLocaleString("en-IN")}`;
    if(r.groups){
      const W=297,H=210,colW=87,cx=c=>12+c*(colW+6),top=46,bot=H-10;let ys=[];
      const page=()=>{np(W,H);pdfHead(doc,ev,sum,W,"Group stage");ys=[top,top,top]};page();
      const ln=(c,y,t,bold,size,col,lh)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.setTextColor(...col);doc.text(pdfFit(doc,t,colW),cx(c),y+lh-1);return y+lh};
      r.groups.forEach(g=>{
        const its=[[g.name,1,11,[209,18,47],6.5]];
        g.players.forEach((p,i)=>its.push([`${i+1}. ${p.name}${p.team?"  ("+p.team+")":""}`,0,8.5,[25,25,25],4.3]));
        g.fixtures.forEach((rd,i)=>{its.push([`Matchday ${i+1}`,1,8,[150,110,20],5]);rd.forEach(m=>its.push([`${m[0].name}  vs  ${m[1].name}`,0,8,[25,25,25],4]))});
        const h=its.reduce((a,i)=>a+i[4],0)+4;
        if(h<=bot-top){ // fits in one column: put it in the emptiest column, groups sit side by side
          let c=ys.indexOf(Math.min(...ys));if(ys[c]+h>bot){page();c=0}
          let y=ys[c];its.forEach(i=>{y=ln(c,y,...i)});ys[c]=y+4;

          its.forEach((it,k)=>{if(y+it[4]>bot){if(c<2)c++;else{page();c=0}y=top;if(k>0){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(209,18,47);doc.text(pdfT(g.name)+" (cont.)",cx(c),y+4.5);y+=6}}y=ln(c,y,...it)});

  });
  return doc;
}

  else if(k==="drfmt")document.querySelectorAll(".grpf").forEach(x=>x.style.display=v==="rrko"?"":"none");
  else if(k==="autm")au(s=>{s.cur.teamId=v});
  else if(k==="aubid")au(s=>{s.cur.bid=parseFloat(v)||0})});
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&!S.user)setTimeout(load,0)});
load();
</script>
