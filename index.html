<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--bg:#000;--panel:#111;--line:#2e2418;--red:#d1122f;--red2:#ff3a55;--gold:#d9a521;--gold2:#f3cf6b;--text:#f4ede0;--muted:#a69a85;--ok:#3fbf7f;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:#000}
body{margin:0;color:var(--text);font:15px/1.5 Barlow,system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h2,h3{font-family:"Bebas Neue","Barlow Condensed",Impact,sans-serif;font-weight:400;letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px}
h2{font-size:38px;line-height:1;color:var(--gold2)}h3{font-size:25px;line-height:1.05}
header{background:linear-gradient(180deg,#1b0207,#000);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{font:400 38px/1 "Bebas Neue","Barlow Condensed",Impact,sans-serif;letter-spacing:.06em;color:var(--gold2)}.logo b{color:var(--red2)}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}.ctl select{width:auto}
select,input,textarea{background:#0a0a0a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);background:#0a0a0a;padding:0 14px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:13px 16px;margin:0;border-radius:0;white-space:nowrap;transform:skewX(-14deg);transition:background .15s,color .15s}nav button span{display:inline-block;transform:skewX(14deg)}nav button:hover:not(.on){color:var(--gold2);background:#1a1208}
nav button.on{color:#fff;background:var(--red);border-color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button{background:var(--gold);color:#000;border:0;border-radius:6px;padding:10px 18px;font:600 15px Barlow,sans-serif;cursor:pointer;margin-top:12px}
button.g{background:var(--gold);color:#000}button.o{background:none;border:1px solid var(--gold);color:var(--gold2)}button.s{padding:6px 12px;font-size:13px;margin:0 6px 0 0}
.m{color:var(--muted)}.gold{color:var(--gold2);font:600 24px "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.note{background:#241a05;border:1px solid var(--gold);color:var(--gold2);padding:10px 14px;border-radius:6px;margin-bottom:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pending{background:#3a2d08;color:var(--gold2)}.verified{background:#0f2e1f;color:var(--ok)}.rejected{background:#3a0a12;color:var(--red2)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--gold)}
.wrap{overflow-x:auto}summary{cursor:pointer;color:var(--gold2);font-weight:600}a{color:var(--gold2)}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.stats .card{margin:0;text-align:center}
.ph{height:170px;width:100%;object-fit:cover;border-radius:8px;border:1px solid var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 18px;border-radius:6px;font-weight:600;display:none;z-index:9}
.av{border-radius:50%;object-fit:cover;background:#1a1a1a;border:2px solid var(--gold);flex:none}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:8px;margin:0;padding:8px 10px;background:#0a0a0a;border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:15px;cursor:pointer}
.ck input{width:auto;accent-color:var(--red)}
.sub{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}.sub button{margin:0;background:none;border:1px solid var(--line);color:var(--text)}.sub button.on{background:var(--gold);border-color:var(--gold);color:#000}
.tls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tl{background:#0a0a0a;border:1px solid var(--line);border-radius:6px;padding:10px}.tl.full{border-color:var(--gold)}
.th{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.st div{background:#171717;border-radius:4px;padding:4px 8px}.st span{display:block;font-size:11px;color:var(--muted)}.st b{color:var(--gold2);font:600 17px "IBM Plex Mono",ui-monospace,monospace}
.sq{max-height:90px;overflow:auto;font-size:13px}.sq div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.pool{max-height:300px;overflow:auto}.pr{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}.pr.cur{background:#2a0a10;border-left:3px solid var(--red)}
.stage{text-align:center;max-width:640px;margin:0 auto 14px}.stage .pn{font:700 38px "Barlow Condensed",sans-serif;color:var(--gold2)}
.stage .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-top:8px}.stage .full{grid-column:1/-1;text-align:center}
.bidrow{display:flex;gap:8px}.bidrow button{margin:0;white-space:nowrap}
@media(max-width:600px){.stage .row{grid-template-columns:1fr}}
.br{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.rdw{display:flex;flex-direction:column;min-width:210px}.rdw h4{margin:0 0 8px;color:var(--gold2);font:700 17px "Barlow Condensed",sans-serif;text-align:center}
.rd{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1}
.mt{background:#0a0a0a;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;font-size:14px}
.mt div{padding:6px 10px;border-bottom:1px solid var(--line)}.mt div:last-child{border:0}.mt .n{font-size:11px;color:var(--muted);background:#151515}
.tm{font-size:11px;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:6px;white-space:nowrap}
#drCount{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;text-align:center;z-index:50}
#drCount .m{font:600 28px "Barlow Condensed",sans-serif;letter-spacing:.06em}
#drCount .big{font:700 min(48vw,260px) "Barlow Condensed",Impact,sans-serif;line-height:1;color:var(--gold2);text-shadow:0 0 40px var(--red);animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(1.7);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.88);opacity:.55}}
.spot{text-align:center;border-left-color:var(--gold);animation:flash 1s}
.spot .pn{font:700 clamp(32px,7vw,56px) "Barlow Condensed",sans-serif;color:var(--gold2)}
.q{color:var(--muted);letter-spacing:.25em}
.hl{background:var(--red);color:#fff;padding:1px 8px;border-radius:4px;animation:flash 1s}
@keyframes flash{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#drCount .big,.spot,.hl,.live i,main.anim>*,main.anim .grid>*,.sk i,.stampw,.stamp,.crest,.tick b{animation:none!important}.evc{transition:none}}

/* ===== sporty skin: hero, event cards, slanted controls ===== */
:where(main button:not(.o):not(.s)){clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);padding-left:24px;padding-right:24px}
:where(main button:not(.o):not(.s)):focus-visible{clip-path:none}
button{transition:filter .15s}button:hover:not(:disabled){filter:brightness(1.14)}
.hero{position:relative;overflow:hidden;padding:26px 16px 54px;background:radial-gradient(ellipse at 85% 40%,rgba(209,18,47,.38),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 2px,transparent 2px 24px),linear-gradient(180deg,#14040a,#000);clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 22px))}
.hero::before{content:"";position:absolute;right:-70px;top:50%;width:360px;height:360px;margin-top:-180px;border:2px solid rgba(217,165,33,.2);border-radius:50%;background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(217,165,33,.2) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px));pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:var(--gold);clip-path:polygon(0 calc(100% - 25px),100% calc(100% - 3px),100% 100%,0 calc(100% - 22px));pointer-events:none}
.hero .in{position:relative;max-width:1000px;margin:0 auto;z-index:1}
.hero.sm{padding:14px 16px 38px}
.hero .tag{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font:600 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:7px;background:var(--red);color:#fff;padding:3px 14px 3px 12px;font:600 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%,100%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
.hero h1{margin:8px 0 0;font:400 clamp(52px,11vw,104px)/.88 "Bebas Neue","Barlow Condensed",Impact,sans-serif;letter-spacing:.03em;color:var(--text)}
.hero h1 b{color:var(--red2);font-weight:400}
.hero h1 .yr{color:transparent;-webkit-text-stroke:1.5px var(--gold);margin-left:.2em}
.hero.sm h1{font-size:clamp(34px,7vw,52px)}
.cd{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.cd div{min-width:68px;text-align:center;background:rgba(0,0,0,.55);border:1px solid var(--line);border-top:2px solid var(--gold);padding:6px 8px 4px}
.cd b{display:block;font:600 28px "IBM Plex Mono",ui-monospace,monospace;color:var(--gold2);font-variant-numeric:tabular-nums}
.cd span{font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.cnt{display:flex;gap:30px;margin-top:20px;flex-wrap:wrap}
.cnt b{display:block;font:600 30px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--text);font-variant-numeric:tabular-nums}
.cnt span{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.evc{border-left:0;border-top:3px solid var(--acc,var(--red));background:linear-gradient(160deg,#171717,#0b0b0b);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);transition:transform .18s}
.evc:hover{transform:translateY(-3px)}
.evh{display:flex;gap:12px;align-items:center}
.evh>div{min-width:0}.evh h3{margin:0;overflow-wrap:anywhere}
.evs{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.evi{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;flex:none;color:var(--acc,var(--gold));background:color-mix(in srgb,var(--acc,#d9a521) 14%,#000);border:1px solid color-mix(in srgb,var(--acc,#d9a521) 50%,#000)}
.fee{display:inline-block;margin:14px 0 6px;background:var(--gold);color:#000;font:600 20px "IBM Plex Mono",ui-monospace,monospace;padding:3px 20px;clip-path:polygon(0 0,100% 0,100% 32%,calc(100% - 7px) 50%,100% 68%,100% 100%,0 100%,0 68%,7px 50%,0 32%)}
.sb{height:6px;background:#222;border-radius:3px;overflow:hidden;margin:8px 0 4px}
.sb i{display:block;height:100%;background:var(--acc,var(--red));border-radius:3px}

/* ===== round 2: spacing scale, buttons, roles, nav, motion, loaders, auction, scoreboard, lightbox ===== */
:root{--s1:4px;--s2:8px;--s3:14px;--s4:20px;--s5:28px}
.card{padding:var(--s4);margin-bottom:var(--s3)}
main{padding:var(--s5) var(--s4) 70px}
.grid,.g2{gap:var(--s3)}
h2{margin-bottom:var(--s3)}
button.d{background:var(--red);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.role{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;padding:3px 12px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.r-super{background:var(--gold);color:#000}.r-admin{background:var(--red);color:#fff}.r-view{background:#1a1a1a;color:var(--muted)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(12,3,6,.93);backdrop-filter:blur(10px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0c0306;z-index:41}
.logo{display:flex;align-items:center;gap:8px}.lm{flex:none}
nav.top{position:sticky;top:calc(var(--hh,62px) + env(safe-area-inset-top,0px));z-index:39}
nav.top button span{display:inline-flex;align-items:center;gap:8px}
.ti{width:17px;height:17px;flex:none}
nav.bar,#sheet{display:none}
@media(max-width:700px){
 nav.top{display:none}.em{display:none}
 header{padding:8px 12px;gap:6px}.logo{font-size:30px}.logo .lm{width:28px;height:28px}
 .ctl{width:100%;flex-wrap:nowrap;gap:8px}.ctl select{flex:1;min-width:0;width:auto;padding:7px 8px}.ctl .s{margin:0;white-space:nowrap}
 nav.bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:0;overflow:visible;padding:0 0 env(safe-area-inset-bottom,0px);background:rgba(10,10,10,.96);backdrop-filter:blur(10px);border-top:2px solid var(--gold);border-bottom:0}
 nav.bar button{flex:1;transform:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;border-bottom:0;border-top:3px solid transparent}
 nav.bar button em{font-style:normal}nav.bar button .ti{width:21px;height:21px}
 nav.bar button.on{background:none;color:var(--gold2);border-top-color:var(--red)}
 #sheet.open{display:block;position:fixed;inset:0;z-index:60}
 #sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.62)}
 #sheet .sh{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:#0e0e0e;border-top:2px solid var(--gold);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
 #sheet .sh button{margin:0;display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:12px;background:#171717;color:var(--text);border:1px solid var(--line);clip-path:none}
 #sheet .sh button.on{border-color:var(--gold);color:var(--gold2)}
 main{padding-bottom:100px}#toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
main.anim>*{animation:rise .45s ease backwards}
main.anim>:nth-child(2){animation-delay:.05s}main.anim>:nth-child(3){animation-delay:.1s}main.anim>:nth-child(4){animation-delay:.15s}main.anim>:nth-child(n+5){animation-delay:.2s}
main.anim .grid>*{animation:rise .5s ease backwards}
main.anim .grid>:nth-child(2){animation-delay:.06s}main.anim .grid>:nth-child(3){animation-delay:.12s}main.anim .grid>:nth-child(4){animation-delay:.18s}
main.anim .grid>:nth-child(5){animation-delay:.24s}main.anim .grid>:nth-child(6){animation-delay:.3s}main.anim .grid>:nth-child(n+7){animation-delay:.36s}
.sk i{display:block;background:linear-gradient(100deg,#141414 30%,#262018 50%,#141414 70%);background-size:300% 100%;animation:shim 1.3s linear infinite;border-radius:8px}
.sk .t{height:36px;width:min(320px,70%);margin-bottom:var(--s4)}.sk .c{height:160px}.sk .c.w{height:110px;margin-bottom:var(--s3)}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:30px 12px;color:var(--muted)}
.empty svg{width:46px;height:46px;color:var(--gold);opacity:.55}
.empty b{color:var(--text);font:400 24px "Bebas Neue","Barlow Condensed",Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.mt{border-top:2px solid var(--gold)}
.mt .n{display:flex;justify-content:space-between;align-items:center;font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--gold);background:#151515}
.mt .n .vs{color:var(--muted)}.mt .n .chip{font-size:10px;padding:0 8px}
.mt .side{font:600 17px "Barlow Condensed",sans-serif;letter-spacing:.02em;padding:8px 10px}
.stage{border-left-color:var(--gold)}
.tick{display:inline-flex;flex-direction:column;align-items:center;margin:14px 0 6px;padding:6px 36px 8px;background:#000;border:2px solid var(--gold);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.tick span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tick b{font:600 clamp(44px,12vw,68px)/1.05 "IBM Plex Mono",ui-monospace,monospace;color:var(--gold2);font-variant-numeric:tabular-nums}
.tick b.bump{animation:bump .45s}@keyframes bump{40%{transform:scale(1.12);color:#fff}}
.stampw{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.6);animation:fade 2.6s both}
@keyframes fade{0%{opacity:0}8%,80%{opacity:1}100%{opacity:0}}
.stamp{font:400 clamp(70px,22vw,190px)/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.06em;padding:0 .2em;border:.06em solid;transform:rotate(-8deg);animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
.stamp.sold{color:var(--red2);border-color:var(--red2);text-shadow:0 0 30px rgba(255,58,85,.55)}
.stamp.unsold{color:var(--muted);border-color:var(--muted)}
@keyframes slam{0%{transform:rotate(-8deg) scale(2.6);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.stampn{font:400 clamp(30px,7vw,58px) "Bebas Neue",Impact,sans-serif;color:var(--gold2);margin-top:20px;letter-spacing:.05em;text-align:center}
.stamps{font:600 clamp(16px,3.5vw,26px) "IBM Plex Mono",ui-monospace,monospace;color:var(--text);margin-top:4px}
#fxc{position:fixed;inset:0;z-index:81;pointer-events:none}
.ph[data-act]{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center}
#lb .bd{position:absolute;inset:0;background:rgba(0,0,0,.93)}
#lb img{position:relative;max-width:92vw;max-height:80vh;border:2px solid var(--gold);cursor:pointer}
#lb .cap{position:relative;margin-top:12px;color:var(--text);font:600 14px "IBM Plex Mono",ui-monospace,monospace;text-align:center;padding:0 16px}
#lb button{position:absolute;margin:0;width:46px;height:46px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:26px;line-height:1;background:rgba(0,0,0,.65);color:var(--gold2);border:1px solid var(--gold);clip-path:none}
#lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:14px}#lb .pv{left:12px;top:50%}#lb .nx{right:12px;top:50%}

.plan{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.plan .ps{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:#0d0d0d;border-left:3px solid var(--gold);padding:8px 12px}
.plan .ps b{font:400 19px "Bebas Neue","Barlow Condensed",Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;min-width:140px}
.plan .pp{font:600 14px "IBM Plex Mono",ui-monospace,monospace;color:var(--gold2)}
.hc{position:relative;margin-top:22px;max-width:760px}
.hc-vp{overflow:hidden;border:1px solid var(--line);background:rgba(0,0,0,.58)}
.hc-tr{display:flex;transition:transform .55s cubic-bezier(.22,.8,.3,1)}
.hc-s{flex:0 0 100%;box-sizing:border-box;min-width:0;padding:16px 18px 18px;border-left:3px solid var(--acc,var(--gold));display:flex;flex-direction:column;gap:6px;cursor:pointer}
.hc-s.lv{background:linear-gradient(90deg,rgba(209,18,47,.22),transparent 70%)}
.hc-top{display:flex;justify-content:space-between;align-items:center}
.hc-up{font:600 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em;color:var(--gold2);border:1px solid var(--gold);padding:2px 10px}
.hc-ic{width:26px;height:26px;color:var(--acc,var(--gold));display:inline-flex}.hc-ic svg{width:100%;height:100%}
.hc-nm{font:400 clamp(28px,6vw,44px)/1 "Bebas Neue","Barlow Condensed",Impact,sans-serif;letter-spacing:.03em;color:var(--text);overflow-wrap:anywhere}
.hc-meta{font-size:13px;color:var(--muted)}
.hc-cd{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;min-height:56px;align-items:center}
.hc-cd div{min-width:60px;text-align:center;background:rgba(0,0,0,.55);border:1px solid var(--line);border-top:2px solid var(--gold);padding:5px 8px 3px}
.hc-cd b{display:block;font:600 24px "IBM Plex Mono",ui-monospace,monospace;color:var(--gold2);font-variant-numeric:tabular-nums}
.hc-cd span{font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.hc-cd .hc-el{font:600 15px "IBM Plex Mono",ui-monospace,monospace;color:var(--text);letter-spacing:0;text-transform:none}
.hc-go{font-size:13px;font-weight:600;color:var(--gold2);margin-top:4px}
.hc-a{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0;padding:0;border:1px solid var(--line);border-radius:0;background:rgba(0,0,0,.75);color:var(--gold2);font:400 22px/1 Barlow,sans-serif;z-index:2}
.hc-a.l{left:-17px}.hc-a.r{right:-17px}
.hc-dots{display:flex;gap:8px;margin-top:10px}
.hc-dots button{width:24px;height:4px;padding:0;margin:0;border:0;border-radius:0;background:var(--line)}
.hc-dots button.on{background:var(--gold)}
.hero.sm .hc{margin-top:12px}
.hero.sm .hc-s{padding:10px 14px 12px;gap:4px}
.hero.sm .hc-nm{font-size:clamp(22px,5vw,30px)}
.hero.sm .hc-meta,.hero.sm .hc-go{display:none}
.hero.sm .hc-cd{min-height:0}.hero.sm .hc-cd b{font-size:18px}.hero.sm .hc-cd div{min-width:48px}
@media(max-width:700px){.hc-a{top:auto;bottom:-8px;margin:0;width:32px;height:28px;font-size:18px}.hc-a.l{left:auto;right:38px}.hc-a.r{right:0}.hc-cd div{min-width:54px}}
@media(prefers-reduced-motion:reduce){.hc-tr{transition:none}}
.oly .th{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.oly-t th,.oly-t td{text-align:center}.oly-t th:nth-child(2),.oly-t td:nth-child(2){text-align:left}
.oly-t td.pts{font:600 18px "IBM Plex Mono",ui-monospace,monospace;color:var(--gold2)}
.oly-t tr.top td{background:rgba(217,165,33,.1)}
.md{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.md.g{background:#e6b422}.md.s{background:#c3c8d1}.md.b{background:#b8733a}
.evsub{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.evsub-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.evsub-h b{font:600 13px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.umb{margin:26px 0 8px}.umbh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--red);padding-bottom:8px;margin-bottom:14px}
.umbs{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px;margin:14px 0;background:rgba(255,255,255,.02)}
.umbd{border:1px dashed var(--line);border-radius:6px;padding:12px;margin-top:12px}.umbs h4,.umbd h4{margin:0 0 6px;color:var(--gold2)}
.ureg{margin:14px 0;padding:14px;border:1px solid var(--line);border-left:3px solid var(--red);background:#0d0d0d}
.chk{display:flex;gap:10px;align-items:center;margin:6px 0;font-weight:400;color:var(--text);cursor:pointer}.chk input{width:auto;margin:0;flex:none}
.pick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#0a0a0a}
/* live auction: wider display, 5 team cards across, players shown as a compact grid */
.auwide{width:min(1600px,calc(100vw - 48px));position:relative;left:50%;transform:translateX(-50%)}
.auwide .tls{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:800px){.auwide .tls{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1200px){.auwide .tls{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:519px){.auwide .tls{grid-template-columns:1fr}}
.aulay{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:14px;align-items:start}
.aulay>.card{margin-bottom:0}
.aulay .stage{max-width:none;margin:0}
@media(max-width:1000px){.aulay{grid-template-columns:1fr}.aulay>.card{margin-bottom:14px}}
.auwide .pool{max-height:none;overflow:visible;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 8px}
.auwide .pr{border:1px solid var(--line);border-radius:6px;background:#0a0a0a;padding:5px 8px;gap:6px;font-size:13px}
.auwide .pr.cur{background:#2a0a10;border-left:3px solid var(--red)}
.auwide .pr .pnm{min-width:0;line-height:1.2;overflow-wrap:anywhere}
.auwide .pr .chip{flex:none;font-size:10px;padding:0 7px}
.auwide .sq{max-height:none;overflow:visible}
.auwide .sq div{height:24px;box-sizing:border-box;align-items:center;padding:0}
.auwide .sq div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.auwide .sq .em{color:var(--muted);opacity:.5;font-style:italic}
.stg{border:1px solid var(--line);border-left:3px solid var(--gold);padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.02)}
.stgh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stgh b{color:var(--gold2);min-width:62px}.stgh select{flex:1;min-width:180px;margin:0}
.stghint{font-size:13px;margin:8px 0 0}
.cd{display:inline-block;min-width:1.7em;text-align:center;background:var(--red);color:#fff;border-radius:4px;padding:0 8px;font:700 16px/1.25 "Barlow Condensed",sans-serif;animation:cdpop 1s ease-out}
@keyframes cdpop{0%{transform:scale(1.7);opacity:.2}30%{transform:scale(1);opacity:1}100%{transform:scale(.95);opacity:.9}}
@media(prefers-reduced-motion:reduce){.cd{animation:none}}
/* team crests */
.stampr{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vw,54px);flex-wrap:wrap}
.crest{position:relative;width:clamp(110px,17vw,220px);aspect-ratio:1;box-sizing:border-box;border-radius:50%;background:#fff;border:4px solid var(--gold);box-shadow:0 0 44px rgba(217,165,33,.5);animation:crestin .6s .2s cubic-bezier(.2,1.4,.4,1) both}
.crest img{position:absolute;inset:13%;width:74%;height:74%;object-fit:contain}
@keyframes crestin{0%{transform:scale(.3) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.tl[data-logo]{position:relative}
.tl[data-logo]::before{content:"";position:absolute;inset:10px;background-repeat:no-repeat;background-position:center;background-size:contain;opacity:.2;pointer-events:none}
.tl[data-logo]>*{position:relative}
.tl[data-logo="knights"]::before{opacity:.14}
.crest.pt img{inset:5%;width:90%;height:90%;border-radius:50%;object-fit:cover}
.tl[data-logo="phelps"]::before,.tl[data-logo="bolt"]::before,.tl[data-logo="larisa"]::before,.tl[data-logo="lewis"]::before{opacity:.22}

/* ===== scoring in the draw format ===== */
.mt.sdadm,.sdfx.sdadm{cursor:pointer}.mt.sdadm:hover,.sdfx.sdadm:hover,.mt.sdadm:focus-visible,.sdfx.sdadm:focus-visible{outline:1px solid var(--gold)}
.mt .side.sdrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sdn{min-width:0;overflow-wrap:anywhere}.sdsd{font-size:11px;margin-left:6px;white-space:nowrap}
.sdg{display:flex;align-items:center;gap:4px;flex:none;font:600 15px "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.sdg i{font-style:normal;min-width:20px;text-align:center;color:var(--muted)}.sdg i.w{color:var(--text)}
.sdg b{min-width:22px;text-align:center;color:var(--gold2);background:#151515;border-radius:3px;padding:0 4px;margin-left:2px}
.sdp{font:600 10px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-style:normal}
.sdwin .sdn{color:var(--gold2)}
.chip.lv{background:#3a0a12;color:var(--red2)}
.sdfx{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;font-size:14px;padding:2px 0}
.sdsc{font:600 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--gold2)}.sdwn{color:var(--gold2);font-weight:600}
.sdst{font-size:13px}.sdst th,.sdst td{padding:4px 6px}.sdst td:first-child,.sdst th:first-child{width:24px}.sdst tr.sdq td{color:var(--gold2)}
.sdadv>summary{font-size:16px}.sdadv[open]>summary{margin-bottom:12px}
#sdm{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
#sdm .bd{position:absolute;inset:0;background:rgba(0,0,0,.82)}
#sdm .sdbox{position:relative;background:var(--panel);border:1px solid var(--gold);border-left:3px solid var(--red);border-radius:8px;padding:16px;width:min(480px,100%);max-height:90vh;overflow:auto}
#sdm h3{margin:0 0 4px;color:var(--gold2)}.sdvs{font:600 20px "Barlow Condensed",sans-serif;margin-bottom:10px}
.sdgr{display:flex;align-items:center;gap:8px;margin:6px 0}.sdgr input{width:64px;text-align:center;font:600 18px "IBM Plex Mono",ui-monospace,monospace;padding:7px 4px}
.sdgn{min-width:74px}.sdtag{font-size:13px;color:var(--gold2);flex:1;min-width:0}.sdgr button{margin:0}
.sdtl{margin-top:8px;min-height:24px}.sdtl button{margin:0 0 0 8px}.sdok{color:var(--ok)}
.sdpick{display:flex;gap:8px;flex-wrap:wrap}.sdpick button{margin-top:6px}#sdm button.o.on{background:var(--gold);color:#000}
.sdbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.sdbtns button:disabled{opacity:.45;cursor:not-allowed}

/* ===== pots ===== */
.pt{display:inline-block;font:700 11px "IBM Plex Mono",ui-monospace,monospace;color:#000;background:var(--gold);border-radius:3px;padding:0 5px;margin-left:6px;white-space:nowrap;vertical-align:middle}

/* ===== welcome banner ===== */
#wbm{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:130px 16px 90px;background:rgba(0,0,0,.84);animation:wbin .35s ease both;overflow:auto}
@keyframes wbin{from{opacity:0}to{opacity:1}}
.wbbox{position:relative;width:min(560px,100%);margin:auto;text-align:center;background:linear-gradient(180deg,#1a0a0e,#0c0306);border:1px solid var(--gold);border-top:3px solid var(--red);border-radius:10px;padding:30px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.wbk{font:600 13px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.wbt{margin:8px 0 0;font:700 clamp(30px,7vw,48px)/1.05 "Barlow Condensed",sans-serif;letter-spacing:.02em;text-transform:uppercase;color:var(--gold2)}
.wbm{margin:16px 0 0;font-size:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.wbw{margin-top:22px;font:500 13px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;color:var(--muted)}
.wbd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;animation:wbp 1.4s ease-in-out infinite}
@keyframes wbp{50%{opacity:.25}}
.wbbox button.wbx{position:absolute;top:8px;right:8px;margin:0;padding:0;width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1;background:#000;color:var(--gold2);border:1px solid var(--gold)}
</style>

        :host {
          display: block;

          --court-navy-light: #111111;
          --court-navy-lighter: #2e2418;
          --line-white: #f4ede0;
          --ball-yellow: #d9a521;
          --live-orange: #ff3a55;
          --slate-mid: #a69a85;
          --win-green: #3fbf7f;
        }
        .app-root {
          background: transparent;
          color: var(--line-white);
          font-family: 'Inter', sans-serif;
          min-height: 40vh;
          padding: 0;
        }
        .app-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 20px 24px 12px;
          border-bottom: 1px solid var(--court-navy-lighter);
          flex-wrap: wrap;
          gap: 12px;
        }
        .header-titles { display: flex; flex-direction: column; gap: 4px; }
        .terrace-banner {
          font-family: 'Titan One', 'Bebas Neue', sans-serif;
          font-weight: 400;
          font-size: 34px;
          letter-spacing: 1px;
          text-transform: uppercase;
          font-style: italic;
          transform: skewX(-8deg);
          color: #FF1E1E;
          -webkit-text-stroke: 1px #0A0A0A;
          text-shadow: 3px 3px 0 rgba(0,0,0,0.6), 0 0 18px rgba(255,30,30,0.4);
          width: fit-content;
          line-height: 1;
        }
        .terrace-banner .cup-red { color: #FF1E1E; }
        .brand {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 18px;
          letter-spacing: 1px;
          color: var(--ball-yellow);
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .brand .court-lines {
          width: 16px; height: 16px;
          border: 2px solid var(--ball-yellow);
          border-radius: 3px;
          position: relative;
          flex-shrink: 0;
        }
        .brand .court-lines::before {
          content: '';
          position: absolute; left: 50%; top: 2px; bottom: 2px;
          width: 2px; background: var(--ball-yellow); transform: translateX(-50%);
        }
        .save-indicator {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 11px;
          color: var(--slate-mid);
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
        .event-selector-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 14px 24px;
          flex-wrap: wrap;
        }
        .event-selector-row .select-input { min-width: 220px; }
        .back-btn, .event-selector-row .select-input { display: none !important; }
        .back-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: none; color: var(--slate-mid);
          font-size: 13px; cursor: pointer; padding: 4px 0;
        }
        .back-btn:hover { color: var(--line-white); }
        .tab-bar {
          display: flex;
          gap: 4px;
          padding: 0 24px;
          border-bottom: 1px solid var(--court-navy-lighter);
          overflow-x: auto;
        }
        .tab-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: none; color: var(--slate-mid);
          font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
          padding: 12px 14px; cursor: pointer; white-space: nowrap;
          border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--ball-yellow); border-bottom-color: var(--ball-yellow); }
        .tab-btn:hover:not(.active) { color: var(--line-white); }
        .main-content { padding: 20px 24px 60px; max-width: 980px; margin: 0 auto; }
        .panel { background: var(--court-navy-light); border: 1px solid var(--court-navy-lighter); border-radius: 10px; padding: 22px; }
        .panel-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.5px; margin: 0 0 14px; color: var(--line-white); }
        .panel-subtitle { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.5px; margin: 0 0 10px; color: var(--slate-mid); }
        .panel-head-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
        .muted { color: var(--slate-mid); font-size: 13px; }
        .muted.small { font-size: 12px; margin-top: -4px; margin-bottom: 14px; }
        .small-label { font-size: 12px; }
        .divider { height: 1px; background: var(--court-navy-lighter); margin: 18px 0; }

        .form-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        .form-row.wrap { flex-wrap: wrap; }
        .text-input, .select-input {
          background: var(--court-navy); border: 1px solid var(--court-navy-lighter);
          color: var(--line-white); padding: 8px 10px; border-radius: 6px; font-size: 13px;
          font-family: 'Inter', sans-serif;
        }
        .text-input:focus, .select-input:focus { outline: none; border-color: var(--ball-yellow); }
        .text-input { flex: 1; min-width: 120px; }
        .text-input.narrow { width: 60px; flex: none; }
        .select-input.full { width: 100%; margin-top: 8px; }

        .primary-btn {
          display: flex; align-items: center; gap: 6px;
          background: var(--ball-yellow); color: var(--court-navy);
          border: none; padding: 8px 14px; border-radius: 6px;
          font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .primary-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .primary-btn:hover:not(:disabled) { filter: brightness(1.08); }
        .ghost-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: 1px solid var(--slate-mid); color: var(--line-white);
          padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
        }
        .ghost-btn:hover { border-color: var(--ball-yellow); color: var(--ball-yellow); }
        .ghost-btn.active { background: var(--ball-yellow); border-color: var(--ball-yellow); color: var(--court-navy); font-weight: 700; }
        .shootout-picker { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; padding: 10px; background: rgba(255,106,61,0.08); border: 1px dashed var(--live-orange); border-radius: 8px; }
        .icon-btn { background: none; border: none; color: var(--slate-mid); cursor: pointer; padding: 4px; display: flex; }
        .icon-btn:hover { color: var(--live-orange); }
        .icon-btn.small { padding: 2px; }

        .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .chip {
          background: var(--court-navy); border: 1px solid var(--court-navy-lighter);
          padding: 5px 8px 5px 12px; border-radius: 20px; font-size: 13px;
          display: flex; align-items: center; gap: 6px;
        }
        .chip-x { background: none; border: none; color: var(--slate-mid); cursor: pointer; display: flex; }
        .chip-x:hover { color: var(--live-orange); }
        .chip-sub { color: var(--slate-mid); font-size: 11.5px; }
        .chip-num {
          background: var(--ball-yellow); color: var(--court-navy); font-weight: 800; font-size: 10.5px;
          width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        }
        button.toggle-chip { cursor: pointer; font-family: inherit; color: var(--line-white); }
        button.toggle-chip.active { background: var(--ball-yellow); border-color: var(--ball-yellow); color: var(--court-navy); font-weight: 600; }

        .event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 8px; }
        .event-card { background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 8px; padding: 14px; cursor: pointer; }
        .event-card:hover { border-color: var(--slate-mid); }
        .event-card.active { border-color: var(--ball-yellow); }
        .event-card-top { display: flex; justify-content: space-between; align-items: center; }
        .sport-emoji { font-size: 20px; }
        .event-card-name { font-weight: 700; margin-top: 6px; }
        .event-card-meta { font-size: 12px; color: var(--slate-mid); margin-top: 2px; }

        .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 12px; }
        .group-card { background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 8px; padding: 12px; }
        .group-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .divider.thin { margin: 10px 0; }
        .skip-matrix-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .ghost-btn.tiny { padding: 4px 9px; font-size: 11.5px; gap: 4px; }
        .skip-matrix-scroll { overflow-x: auto; padding-bottom: 4px; }
        .skip-matrix { border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; }
        .skip-matrix th, .skip-matrix td { padding: 2px; text-align: center; }

const TEAM_LOGO_RE=[[/rooftop/i,"rooftop"],[/achiever/i,"achievers"],[/knight/i,"knights"],[/ball\s*-?\s*bust/i,"ballbusters"],[/panther/i,"panthers"],[/phelps/i,"phelps"],[/bolt/i,"bolt"],[/larisa|latynina/i,"larisa"],[/lewis/i,"lewis"]];
const teamLogo=n=>{const m=TEAM_LOGO_RE.find(x=>x[0].test(n||""));return m?m[1]:""};
(()=>{const st=document.createElement("style");st.textContent=Object.entries(TEAM_ART).map(([k,v])=>`.tl[data-logo="${k}"]::before{background-image:url(${v.w})}`).join("\n");document.head.appendChild(st)})();
function fxConfetti(){
  if(reduced())return;
  const c=document.createElement("canvas");c.id="fxc";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext("2d"),cols=["#d9a521","#f3cf6b","#d1122f","#ff3a55","#ffffff"];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*16,vy:-Math.random()*13-3,g:.32+Math.random()*.18,w:6+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){const p=(t-t0)/1900;x.clearRect(0,0,c.width,c.height);
    ps.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.vx*=.99;q.r+=q.vr;x.save();x.globalAlpha=Math.max(0,1-p*.8);x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.w/2,-q.h/2,q.w,q.h);x.restore()});
    if(p<1)requestAnimationFrame(f);else c.remove()})(t0);
}
function fxStamp(kind,name,sub,logo){
  document.querySelectorAll(".stampw").forEach(e=>e.remove());
  const d=document.createElement("div");d.className="stampw";
  const cr=logo&&TEAM_ART[logo]?`<div class="crest${TEAM_ART[logo].p?" pt":""}"><img src="${TEAM_ART[logo].c}" alt=""></div>`:"";
  d.innerHTML=`<div class="stampr"><div class="stamp ${kind}">${kind==="sold"?"SOLD":"UNSOLD"}</div>${cr}</div><div class="stampn">${E(name)}</div><div class="stamps">${E(sub)}</div>`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2600);
}
function auFx(){
  const s=AU.st;if(!s)return;
  const b=$("#bidv");
  if(b){const to=+b.dataset.to,pid=b.dataset.pid;
    if(AU.tp===pid&&AU.tv!=null&&AU.tv!==to&&!reduced()){
      const from=AU.tv,t0=performance.now();b.classList.add("bump");
      (function f(t){const p=Math.min(1,(t-t0)/450);b.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
    AU.tp=pid;AU.tv=to}
  const h=s.history||[],n=h.length;
  if(AU.seen==null||AU.seenEv!==AU.ev){AU.seen=n;AU.seenEv=AU.ev;return}
  if(n>AU.seen){const l=h[n-1],pl=s.players.find(p=>p.id===l.playerId),tm=s.teams.find(t=>t.id===l.teamId);
    if(l.type==="sold"){fxStamp("sold",pl?pl.name:"",(tm?tm.name:"")+" · "+l.price,teamLogo(tm?tm.name:""));fxConfetti()}
    else if(l.type==="unsold")fxStamp("unsold",pl?pl.name:"","No bids")}
  AU.seen=n;
}

const TABS=[["reg","Player registration"],["ev","Event registration"],["auc","Auction"],["draw","Draw"],["score","Scoring"],["part","Participants"],["mem","Members"],["bud","Budget"],["gal","Gallery"],["fb","Feedback"]];
const soon=(t,n)=>`<h2>${t}</h2><div class="note">${n}</div>`;

// ---------- data loading ----------
async function load(){
  const {data:{user}}=await sb.auth.getUser();
  S.user=user; if(!user) return render();
  const [p,e,pl]=await Promise.all([
    sb.from("profiles").select("role").eq("id",user.id).single(),
    sb.from("editions").select("*").order("year",{ascending:false}),
    sb.from("players").select("*").eq("user_id",user.id).maybeSingle()]);
  S.role=p.data?.role||"viewer"; S.eds=e.data||[]; S.player=pl.data;
  let saved=null; try{saved=+localStorage.getItem("tc_ed")}catch{}
  S.ed=S.eds.find(x=>x.id===saved)||S.eds.find(x=>x.is_active)||S.eds[0]||null;
  if(S.tab==="reg"&&S.player) S.tab="ev";
  S.anim=true;render();
}

// ---------- rendering ----------
async function render(){
  const app=$("#app");
  if(!S.user||(S.tab!=="auc"&&S.tab!=="draw")){const wb=$("#wbm");if(wb)wb.remove()}
  if(!S.user){app.innerHTML=loginHTML();return}
  if(!S.player) S.tab="reg";
  const tabs=TABS.filter(t=>t[0]!=="mem"||isAdm()),PRI=["ev","auc","draw","score"],more=tabs.filter(t=>!PRI.includes(t[0]));
  const role=S.role==="super"?["r-super","Super admin"]:S.role==="admin"?["r-admin","Admin"]:["r-view","Viewer"];
  const anim=S.anim;S.anim=false;
  app.innerHTML=`<header><div class="logo">${LOGO}<span>Terrace <b>Cup</b></span></div><div class="ctl">
    <select data-chg="ed">${S.eds.map(x=>`<option value="${x.id}" ${S.ed&&x.id===S.ed.id?"selected":""}>${E(x.name)}${x.is_active?" (live)":" (archive)"}</option>`).join("")}</select>
    <span class="em">${E(S.user.email)}</span><span class="role ${role[0]}">${role[1]}</span>
    <button class="s o" data-act="out">Sign out</button></div></header>
    ${heroHTML()}
    ${S.player?`<nav class="top">${tabs.map(t=>`<button data-tab="${t[0]}" class="${t[0]===S.tab?"on":""}"><span>${TICO[t[0]]}${t[1]}</span></button>`).join("")}</nav>
    <nav class="bar">${tabs.filter(t=>PRI.includes(t[0])).map(t=>`<button data-tab="${t[0]}" class="${t[0]===S.tab?"on":""}">${TICO[t[0]]}<em>${BAR[t[0]]}</em></button>`).join("")}<button data-act="more" class="${more.some(t=>t[0]===S.tab)?"on":""}">${TICO.more}<em>More</em></button></nav>
    <div id="sheet"><div class="bd" data-act="more"></div><div class="sh">${more.map(t=>`<button data-tab="${t[0]}" class="${t[0]===S.tab?"on":""}">${TICO[t[0]]}${t[1]}</button>`).join("")}</div></div>`:""}
    <main id="main" class="${anim?"anim":""}">${skel()}</main>`;
  const hd=$("header");if(hd)document.documentElement.style.setProperty("--hh",hd.offsetHeight+"px");
  heroInit();bnInit();
  let h; try{h=await V[S.tab]()}catch(err){h=`<div class="note">${E(err.message)}</div>`}
  const m=$("#main"); if(m) m.innerHTML=h;
  const sl=$("#scSlot"); if(sl) scAttach(sl);
  if(S.tab==="draw")drPlanRender();
  if(S.tab==="auc")auFx();else AU.seen=null;
  wbPaint();
}

  const btn={in:"Sign in",up:"Create account",code:"Email me a code",verify:"Verify and continue"}[S.mode];

// ---------- scoring (Courtside) ----------
// The scoring UI is a React app bundled above (CourtsideScoring). It lives in a shadow root and talks to
// Supabase only through this bridge: one row per scoring event in public.score_events (see scoring.sql).
const SC={ed:null,events:[],dirty:new Set(),gone:new Set(),canEdit:false,status:"idle",err:"",subs:new Set(),timer:0,ch:null,host:null,loading:null};
SC.emit=()=>SC.subs.forEach(f=>f());SC.focus=null;SC.pe=null;
SC.bridge={
  subscribe:f=>{SC.subs.add(f);return()=>SC.subs.delete(f)},
  getEvents:()=>SC.events, getCanEdit:()=>SC.canEdit, getStatus:()=>SC.status,
  setEvents(u){
    if(!SC.canEdit)return;
    const prev=SC.events,next=typeof u==="function"?u(prev):u;if(next===prev)return;
    const pm=new Map(prev.map(e=>[e.id,e])),nm=new Set(next.map(e=>e.id));
    next.forEach(e=>{if(pm.get(e.id)!==e){SC.dirty.add(e.id);SC.gone.delete(e.id)}});
    prev.forEach(e=>{if(!nm.has(e.id)){SC.gone.add(e.id);SC.dirty.delete(e.id)}});
    SC.events=next;SC.status="saving";SC.emit();clearTimeout(SC.timer);SC.timer=setTimeout(scFlush,500)}
};
SC.bridge.getFocus=()=>SC.focus;
SC.bridge.listImports=async()=>{
  const ed=SC.ed;if(!ed)return [];
  const ev=await sb.from("events").select("*").eq("edition_id",ed.id).order("id");
  if(ev.error)throw ev.error;
  const evs=ev.data||[],ids=evs.map(e=>e.id);if(!ids.length)return [];
  const [d,a,p]=await Promise.all([
    sb.from("draws").select("event_id,state").in("event_id",ids),
    auFor(ids),
    sb.from("participants").select("event_id,full_name").in("event_id",ids).eq("status","verified")]);
  return evs.map(e=>{
    const res=((d.data||[]).find(x=>x.event_id===e.id)||{}).state?.result;
    const draw=res&&res.revealed!==false&&(res.rounds||res.groups)?res:null;
    const teams=(((a.data||[]).find(x=>x.event_id===e.id)||{}).state?.teams||[]).filter(t=>t.captain||(t.squad||[]).length);
    const pg=((d.data||[]).find(x=>x.event_id===e.id)||{}).state?.pairing,pairs=e.kind==="doubles"?(pg&&pg.confirmed?(pg.pairs||[]).map(x=>`${x.a.name} / ${x.b.name}`):[]):null;
    return {id:e.id,name:e.name,draw,staged:!!(res&&res.format==="staged"&&res.revealed!==false),
      auction:teams.map(t=>({name:t.name,captain:t.captain||"",squad:(t.squad||[]).map(s=>s.name)})),
      players:pairs?pairs:(p.data||[]).filter(x=>x.event_id===e.id).map(x=>x.full_name).filter(Boolean)};
  });
};
async function scFlush(){
  const ed=SC.ed;if(!ed||!S.user)return;
  const now=new Date().toISOString();
  const up=SC.events.filter(e=>SC.dirty.has(e.id)).map(e=>({id:e.id,edition_id:ed.id,data:e,updated_by:S.user.id,updated_at:now}));
  const del=[...SC.gone];SC.dirty.clear();SC.gone.clear();
  let ok=true;
  if(up.length){const r=await sb.from("score_events").upsert(up);if(r.error){ok=false;up.forEach(u=>SC.dirty.add(u.id));toast(r.error.message)}}
  if(del.length){const r=await sb.from("score_events").delete().in("id",del).eq("edition_id",ed.id);if(r.error){ok=false;del.forEach(id=>SC.gone.add(id));toast(r.error.message)}}
  SC.status=ok?"saved":"error";SC.emit();
  if(!ok){clearTimeout(SC.timer);SC.timer=setTimeout(scFlush,5000)}
}
async function scSettle(){if(SC.dirty.size||SC.gone.size){clearTimeout(SC.timer);await scFlush()}}
function scRemote(p){
  const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.id)return;
  if(SC.dirty.has(row.id))return; // our unsaved edit wins; it will overwrite on the next flush
  if(p.eventType==="DELETE"){SC.events=SC.events.filter(e=>e.id!==row.id);SC.emit();return}
  const cur=SC.events.find(e=>e.id===row.id);
  if(cur&&JSON.stringify(cur)===JSON.stringify(row.data))return; // echo of our own save
  SC.events=cur?SC.events.map(e=>e.id===row.id?row.data:e):[...SC.events,row.data];SC.emit();
}
async function scLoad(){
  while(SC.loading)await SC.loading;
  const ed=S.ed;SC.canEdit=isAdm()&&!!ed&&!!ed.is_active;
  if(SC.ed&&SC.ed.id===ed.id){SC.ed=ed;SC.emit();return}
  SC.loading=(async()=>{
    await scSettle();
    if(SC.ch){sb.removeChannel(SC.ch);SC.ch=null}
    SC.ed=ed;SC.events=[];SC.status="idle";SC.err="";
    const r=await sb.from("score_events").select("id,data").eq("edition_id",ed.id).order("created_at").order("id");
    if(r.error){SC.err=r.error.message;SC.ed=null}
    else{
      SC.events=(r.data||[]).map(x=>x.data);
      SC.ch=sb.channel("score-"+ed.id).on("postgres_changes",{event:"*",schema:"public",table:"score_events",filter:"edition_id=eq."+ed.id},scRemote).subscribe();
    }
    SC.emit();
  })();
  try{await SC.loading}finally{SC.loading=null}
}
async function scReset(){
  await scSettle();
  if(SC.ch){sb.removeChannel(SC.ch);SC.ch=null}
  SC.ed=null;SC.events=[];SC.canEdit=false;SC.status="idle";SC.focus=null;SC.pe=null;SC.emit();
  if(SC.host&&SC.host.parentNode)SC.host.remove();
}
function scAttach(slot){
  if(!SC.host)SC.host=CourtsideScoring.mountScoring(SC.bridge);
  if(SC.host.parentNode!==slot)slot.appendChild(SC.host);
}
function scBuild(imp,team,row){
  let ev=CourtsideScoring.importEvent(team?{...imp,draw:null}:imp,team?"auction":"draw",CourtsideScoring.guessSport(imp.name),"1, 2");
  ev.source.drawCreated=team?"":((imp.draw&&imp.draw.created)||"");
  if(!team&&imp.draw){const pm=new Map();(imp.draw.players||[]).forEach(p=>{if(p.pot)pm.set(String(p.name||"").trim().toLowerCase()+"|"+String(p.team||"").trim().toLowerCase(),p.pot)});
    ev.players.forEach(pl=>{const k=String(pl.name||"").trim().toLowerCase()+"|"+String(pl.club||"").trim().toLowerCase();if(pm.has(k))pl.pot=pm.get(k)})}
  if(!team&&imp.draw){const v=sdSnap(imp.draw);ev.drawView=v;if(v.format==="rrko")ev.knockout=sdMkKO(v);if(ev.knockout)ev=sdFix(ev).se}
  const fc=row&&row.format_config;
  if(fc){ev.planned={teams:fc.players||0,groups:fc.format==="rrko"?(fc.groups||1):1,advance:fc.advance||2};if(team&&fc.format==="rrko")ev.cfg.qualifiersPerGroup=fc.advance||2}
  return ev}
// teams the auction forms later are added to the scoring event by themselves
function scSyncTeams(se,imp){
  const have=new Set((se.teams||[]).filter(t=>!t.placeholder).map(t=>String(t.name).trim().toLowerCase()));
  const add=(imp.auction||[]).filter(t=>!have.has(String(t.name).trim().toLowerCase()));if(!add.length)return null;
  const nid=p=>p+"_"+Math.random().toString(36).slice(2,9),players=[...(se.players||[])],teams=[...(se.teams||[])];

// ---------- Olympics medal tally (shown on the Scoring tab when "olympics" appears in an event or auction name) ----------
const OLY={G:10,S:6,B:4,d:null};
const olyRe=/olympics/i;
async function olyLoad(){
  const ed=S.ed;if(!ed)return null;
  const ev=await sb.from("events").select("id,name").eq("edition_id",ed.id).order("id");
  const evs=ev.data||[],ids=evs.map(e=>e.id),nm=new Map(evs.map(e=>[e.id,e.name]));
  const au=ids.length?await sb.from("auctions").select("event_id,state").in("event_id",ids):{data:[]};
  const auc=(au.data||[]).map(a=>({name:nm.get(a.event_id)||"",tourn:(a.state&&a.state.tournName)||"",teams:(a.state&&a.state.teams)||[]}));
  const hit=auc.filter(a=>olyRe.test(a.name)||olyRe.test(a.tourn));
  if(!evs.some(e=>olyRe.test(e.name))&&!hit.length){OLY.d=null;return null}
  // Teams come from the Olympics auction; if only an event is named Olympics, from the edition's auctions.
  const seen=new Set(),teams=[];
  (hit.length?hit:auc).forEach(a=>a.teams.forEach(t=>{const n=String(t.name||"").trim(),k=n.toLowerCase();if(n&&!seen.has(k)){seen.add(k);teams.push(n)}}));
  const aw=await sb.from("medal_awards").select("*").eq("edition_id",ed.id);
  const awards=(aw.data||[]).slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  return OLY.d={evs,teams,awards,err:aw.error?aw.error.message:""};
}
function olyTally(d){
  const rows=new Map(d.teams.map(n=>[n.toLowerCase(),{team:n,g:0,s:0,b:0}]));
  d.awards.forEach(a=>{const k=String(a.team).toLowerCase();if(!rows.has(k))rows.set(k,{team:a.team,g:0,s:0,b:0});
    const r=rows.get(k);if(a.medal==="gold")r.g++;else if(a.medal==="silver")r.s++;else r.b++});
  const out=[...rows.values()].map(r=>({...r,pts:r.g*OLY.G+r.s*OLY.S+r.b*OLY.B}))
    .sort((x,y)=>y.pts-x.pts||y.g-x.g||y.s-x.s||y.b-x.b||x.team.localeCompare(y.team));
  out.forEach((r,i)=>{const p=out[i-1];r.rank=p&&p.pts===r.pts&&p.g===r.g&&p.s===r.s&&p.b===r.b?p.rank:i+1});
  return out;
}

    <label>Event or discipline</label><input name="label" list="olylbl" required placeholder="e.g. 4 × 100 m relay"><datalist id="olylbl">${d.evs.map(e=>`<option value="${E(e.name)}">`).join("")}</datalist>
    <div class="g2"><div><label>${md("g")}Gold, ${OLY.G} points</label><select name="gold">${opts}</select></div>
    <div><label>${md("s")}Silver, ${OLY.S} points</label><select name="silver">${opts}</select></div>
    <div><label>${md("b")}Bronze, ${OLY.B} points</label><select name="bronze">${opts}</select></div></div>

  return `<div class="card oly">${head}<div class="wrap"><table class="oly-t"><tr><th>#</th><th>Team</th><th>${md("g")}Gold</th><th>${md("s")}Silver</th><th>${md("b")}Bronze</th><th>Points</th></tr>
  ${t.map(r=>`<tr class="${r.rank===1&&r.pts>0?"top":""}"><td>${r.rank}</td><td><b>${E(r.team)}</b></td><td>${r.g}</td><td>${r.s}</td><td>${r.b}</td><td class="pts">${r.pts}</td></tr>`).join("")||`<tr><td colspan="6">${empty("No teams yet","Teams are picked up from the Auction tab.")}</td></tr>`}</table></div>${form}${log}</div>`;
}

const uid=()=>Math.random().toString(36).slice(2,10);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const auPool=s=>{const c=s.settings.totalPlayers;return c>0?s.players.slice(0,c):s.players};
function auPend(s){
  const pool=auPool(s),ids=pool.map(p=>p.id);
  s.callOrder=(s.callOrder||[]).filter(i=>ids.includes(i));
  const miss=ids.filter(i=>!s.callOrder.includes(i));
  if(miss.length)s.callOrder=s.callOrder.concat(shuf(miss));
  const m=new Map(pool.map(p=>[p.id,p]));
  return s.callOrder.map(i=>m.get(i)).filter(p=>p&&p.status==="pending");
}
const auFull=(s,t)=>{const c=s.settings.maxPerTeam;return !!(c>0&&t.squad.length+1>=c)};
const auMin=s=>{const p=auPool(s);return p.length?Math.min(...p.map(x=>x.base)):0};
function auMax(s,t){const c=s.settings.maxPerTeam,rem=t.budget-t.spent;if(!(c>0))return null;const need=c-(t.squad.length+1);if(need<=1)return rem;return Math.max(0,rem-(need-1)*auMin(s))}
const auCur=s=>{const p=s.cur&&auPool(s).find(x=>x.id===s.cur.pid);return p&&p.status==="pending"?p:null};
function auReturn(s){const ids=auPool(s).filter(p=>p.status==="unsold").map(p=>p.id);ids.forEach(id=>{s.players.find(x=>x.id===id).status="pending"});if(ids.length)s.round=(s.round||1)+1;return ids}

  if(k==="ed"){S.ed=S.eds.find(x=>x.id===+v);AU.ev=null;AU.loaded=null;DR.ev=null;try{localStorage.setItem("tc_ed",S.ed.id)}catch{}S.anim=true;render()}
  else if(k==="scev"){SC.pe=+v;render()}
  else if(k==="role"){if(S.role==="super")setRole(e.target.dataset.uid,v)}
  else if(k==="auev"){AU.ev=+v;AU.loaded=null;render()}
  else if(k==="drev"){DR.ev=+v;render()}
  else if(k==="drpots")dr(s=>{const pg=drPg(s);pg.pots=v==="1";if(pg.pots&&!pg.combos)pg.combos="A+B"});
  else if(k==="drcombos")dr(s=>{drPg(s).combos=v});
  else if(k==="drnp")dr(s=>{drPg(s).np=+v||2});
  else if(k==="drgmode")drPlanRender();
  else if(k==="drpot")dr(s=>{const p=drPg(s).pool[+e.target.dataset.i];if(p)p.pot=v});
  else if(k==="drfmt")document.querySelectorAll(".grpf").forEach(x=>x.style.display=v==="rrko"?"":"none");
  else if(k==="autm")au(s=>{if(s.cur)s.cur.teamId=v});
  else if(k==="aubid")au(s=>{if(s.cur)s.cur.bid=parseFloat(v)||0})});
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&!S.user)setTimeout(load,0)});
load();
</script>
