<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrace Cup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--bg:#000;--panel:#111;--line:#2e2418;--red:#d1122f;--red2:#ff3a55;--gold:#d9a521;--gold2:#f3cf6b;--text:#f4ede0;--muted:#a69a85;--ok:#3fbf7f;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:#000}
body{margin:0;color:var(--text);font:15px/1.5 Barlow,system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;margin:0 0 8px}
h2{font-size:30px;color:var(--gold2)}h3{font-size:21px}
header{background:linear-gradient(180deg,#1b0207,#000);border-bottom:2px solid var(--gold);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{font:700 32px "Barlow Condensed",Impact,sans-serif;color:var(--gold2)}.logo b{color:var(--red2)}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}.ctl select{width:auto}
select,input,textarea{background:#0a0a0a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold)}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:#0a0a0a;padding:0 8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:13px 14px;margin:0;border-radius:0;white-space:nowrap}
nav button.on{color:var(--gold2);border-color:var(--red)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:600 15px Barlow,sans-serif;cursor:pointer;margin-top:12px}
button.g{background:var(--gold);color:#000}button.o{background:none;border:1px solid var(--gold);color:var(--gold2)}button.s{padding:6px 12px;font-size:13px;margin:0 6px 0 0}
.m{color:var(--muted)}.gold{color:var(--gold2);font:700 26px "Barlow Condensed",sans-serif}
.note{background:#241a05;border:1px solid var(--gold);color:var(--gold2);padding:10px 14px;border-radius:6px;margin-bottom:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pending{background:#3a2d08;color:var(--gold2)}.verified{background:#0f2e1f;color:var(--ok)}.rejected{background:#3a0a12;color:var(--red2)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--gold)}
.wrap{overflow-x:auto}summary{cursor:pointer;color:var(--gold2);font-weight:600}a{color:var(--gold2)}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.stats .card{margin:0;text-align:center}
.ph{height:170px;width:100%;object-fit:cover;border-radius:8px;border:1px solid var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 18px;border-radius:6px;font-weight:600;display:none;z-index:9}
.av{border-radius:50%;object-fit:cover;background:#1a1a1a;border:2px solid var(--gold);flex:none}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:8px;margin:0;padding:8px 10px;background:#0a0a0a;border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:15px;cursor:pointer}
.ck input{width:auto;accent-color:var(--red)}
.sub{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}.sub button{margin:0;background:none;border:1px solid var(--line);color:var(--text)}.sub button.on{background:var(--gold);border-color:var(--gold);color:#000}
.tls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tl{background:#0a0a0a;border:1px solid var(--line);border-radius:6px;padding:10px}.tl.full{border-color:var(--gold)}
.th{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.st div{background:#171717;border-radius:4px;padding:4px 8px}.st span{display:block;font-size:11px;color:var(--muted)}.st b{color:var(--gold2);font-size:17px}
.sq{max-height:90px;overflow:auto;font-size:13px}.sq div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.pool{max-height:300px;overflow:auto}.pr{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}.pr.cur{background:#2a0a10;border-left:3px solid var(--red)}
.stage{text-align:center;max-width:640px;margin:0 auto 14px}.stage .pn{font:700 38px "Barlow Condensed",sans-serif;color:var(--gold2)}
.stage .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-top:8px}.stage .full{grid-column:1/-1;text-align:center}
.bidrow{display:flex;gap:8px}.bidrow button{margin:0;white-space:nowrap}
@media(max-width:600px){.stage .row{grid-template-columns:1fr}}
.br{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.rdw{display:flex;flex-direction:column;min-width:210px}.rdw h4{margin:0 0 8px;color:var(--gold2);font:700 17px "Barlow Condensed",sans-serif;text-align:center}
.rd{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1}
.mt{background:#0a0a0a;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;font-size:14px}
.mt div{padding:6px 10px;border-bottom:1px solid var(--line)}.mt div:last-child{border:0}.mt .n{font-size:11px;color:var(--muted);background:#151515}
.tm{font-size:11px;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:6px;white-space:nowrap}
#drCount{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;text-align:center;z-index:50}
#drCount .m{font:600 28px "Barlow Condensed",sans-serif;letter-spacing:.06em}
#drCount .big{font:700 min(48vw,260px) "Barlow Condensed",Impact,sans-serif;line-height:1;color:var(--gold2);text-shadow:0 0 40px var(--red);animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(1.7);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.88);opacity:.55}}
.spot{text-align:center;border-left-color:var(--gold);animation:flash 1s}
.spot .pn{font:700 clamp(32px,7vw,56px) "Barlow Condensed",sans-serif;color:var(--gold2)}
.q{color:var(--muted);letter-spacing:.25em}
.hl{background:var(--red);color:#fff;padding:1px 8px;border-radius:4px;animation:flash 1s}
@keyframes flash{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#drCount .big,.spot,.hl{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

        :host {
          display: block;
          --court-navy: #0a0a0a;
          --court-navy-light: #111111;
          --court-navy-lighter: #2e2418;
          --line-white: #f4ede0;
          --ball-yellow: #d9a521;
          --live-orange: #ff3a55;
          --slate-mid: #a69a85;
          --win-green: #3fbf7f;
        }
        .app-root {
          background: transparent;
          color: var(--line-white);
          font-family: 'Inter', sans-serif;
          min-height: 40vh;
          padding: 0;
        }
        .app-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 20px 24px 12px;
          border-bottom: 1px solid var(--court-navy-lighter);
          flex-wrap: wrap;
          gap: 12px;
        }
        .header-titles { display: flex; flex-direction: column; gap: 4px; }
        .terrace-banner {
          font-family: 'Titan One', 'Bebas Neue', sans-serif;
          font-weight: 400;
          font-size: 34px;
          letter-spacing: 1px;
          text-transform: uppercase;
          font-style: italic;
          transform: skewX(-8deg);
          color: #FF1E1E;
          -webkit-text-stroke: 1px #0A0A0A;
          text-shadow: 3px 3px 0 rgba(0,0,0,0.6), 0 0 18px rgba(255,30,30,0.4);
          width: fit-content;
          line-height: 1;
        }
        .terrace-banner .cup-red { color: #FF1E1E; }
        .brand {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 18px;
          letter-spacing: 1px;
          color: var(--ball-yellow);
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .brand .court-lines {
          width: 16px; height: 16px;
          border: 2px solid var(--ball-yellow);
          border-radius: 3px;
          position: relative;
          flex-shrink: 0;
        }
        .brand .court-lines::before {
          content: '';
          position: absolute; left: 50%; top: 2px; bottom: 2px;
          width: 2px; background: var(--ball-yellow); transform: translateX(-50%);
        }
        .save-indicator {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 11px;
          color: var(--slate-mid);
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
        .event-selector-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 14px 24px;
          flex-wrap: wrap;
        }
        .event-selector-row .select-input { min-width: 220px; }
        .back-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: none; color: var(--slate-mid);
          font-size: 13px; cursor: pointer; padding: 4px 0;
        }
        .back-btn:hover { color: var(--line-white); }
        .tab-bar {
          display: flex;
          gap: 4px;
          padding: 0 24px;
          border-bottom: 1px solid var(--court-navy-lighter);
          overflow-x: auto;
        }
        .tab-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: none; color: var(--slate-mid);
          font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
          padding: 12px 14px; cursor: pointer; white-space: nowrap;
          border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--ball-yellow); border-bottom-color: var(--ball-yellow); }
        .tab-btn:hover:not(.active) { color: var(--line-white); }
        .main-content { padding: 20px 24px 60px; max-width: 980px; margin: 0 auto; }
        .panel { background: var(--court-navy-light); border: 1px solid var(--court-navy-lighter); border-radius: 10px; padding: 22px; }
        .panel-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.5px; margin: 0 0 14px; color: var(--line-white); }
        .panel-subtitle { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.5px; margin: 0 0 10px; color: var(--slate-mid); }
        .panel-head-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
        .muted { color: var(--slate-mid); font-size: 13px; }
        .muted.small { font-size: 12px; margin-top: -4px; margin-bottom: 14px; }
        .small-label { font-size: 12px; }
        .divider { height: 1px; background: var(--court-navy-lighter); margin: 18px 0; }

        .form-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        .form-row.wrap { flex-wrap: wrap; }
        .text-input, .select-input {
          background: var(--court-navy); border: 1px solid var(--court-navy-lighter);
          color: var(--line-white); padding: 8px 10px; border-radius: 6px; font-size: 13px;
          font-family: 'Inter', sans-serif;
        }
        .text-input:focus, .select-input:focus { outline: none; border-color: var(--ball-yellow); }
        .text-input { flex: 1; min-width: 120px; }
        .text-input.narrow { width: 60px; flex: none; }
        .select-input.full { width: 100%; margin-top: 8px; }

        .primary-btn {
          display: flex; align-items: center; gap: 6px;
          background: var(--ball-yellow); color: var(--court-navy);
          border: none; padding: 8px 14px; border-radius: 6px;
          font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .primary-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .primary-btn:hover:not(:disabled) { filter: brightness(1.08); }
        .ghost-btn {
          display: flex; align-items: center; gap: 6px;
          background: none; border: 1px solid var(--slate-mid); color: var(--line-white);
          padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
        }
        .ghost-btn:hover { border-color: var(--ball-yellow); color: var(--ball-yellow); }
        .ghost-btn.active { background: var(--ball-yellow); border-color: var(--ball-yellow); color: var(--court-navy); font-weight: 700; }
        .shootout-picker { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; padding: 10px; background: rgba(255,106,61,0.08); border: 1px dashed var(--live-orange); border-radius: 8px; }
        .icon-btn { background: none; border: none; color: var(--slate-mid); cursor: pointer; padding: 4px; display: flex; }
        .icon-btn:hover { color: var(--live-orange); }
        .icon-btn.small { padding: 2px; }

        .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .chip {
          background: var(--court-navy); border: 1px solid var(--court-navy-lighter);
          padding: 5px 8px 5px 12px; border-radius: 20px; font-size: 13px;
          display: flex; align-items: center; gap: 6px;
        }
        .chip-x { background: none; border: none; color: var(--slate-mid); cursor: pointer; display: flex; }
        .chip-x:hover { color: var(--live-orange); }
        .chip-sub { color: var(--slate-mid); font-size: 11.5px; }
        .chip-num {
          background: var(--ball-yellow); color: var(--court-navy); font-weight: 800; font-size: 10.5px;
          width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        }
        button.toggle-chip { cursor: pointer; font-family: inherit; color: var(--line-white); }
        button.toggle-chip.active { background: var(--ball-yellow); border-color: var(--ball-yellow); color: var(--court-navy); font-weight: 600; }

        .event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 8px; }
        .event-card { background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 8px; padding: 14px; cursor: pointer; }
        .event-card:hover { border-color: var(--slate-mid); }
        .event-card.active { border-color: var(--ball-yellow); }
        .event-card-top { display: flex; justify-content: space-between; align-items: center; }
        .sport-emoji { font-size: 20px; }
        .event-card-name { font-weight: 700; margin-top: 6px; }
        .event-card-meta { font-size: 12px; color: var(--slate-mid); margin-top: 2px; }

        .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 12px; }
        .group-card { background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 8px; padding: 12px; }
        .group-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .divider.thin { margin: 10px 0; }
        .skip-matrix-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .ghost-btn.tiny { padding: 4px 9px; font-size: 11.5px; gap: 4px; }
        .skip-matrix-scroll { overflow-x: auto; padding-bottom: 4px; }
        .skip-matrix { border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; }
        .skip-matrix th, .skip-matrix td { padding: 2px; text-align: center; }
        .skip-matrix thead th {
          color: var(--slate-mid); font-size: 10.5px; font-weight: 700; min-width: 24px;
        }
        .skip-matrix tbody th {
          color: var(--slate-mid); font-size: 10.5px; font-weight: 700; padding-right: 6px; text-align: right;
        }
        .skip-cell {
          width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--court-navy-lighter);
          background: var(--court-navy); color: var(--win-green); font-size: 13px; font-weight: 700;
          cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
        }
        .skip-cell:hover { border-color: var(--slate-mid); }
        .skip-cell.skipped { background: rgba(255,106,61,0.14); border-color: var(--live-orange); color: var(--live-orange); }
        .skip-cell.diagonal {
          width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
          color: var(--court-navy-lighter); background: none; border: none; cursor: default; font-size: 12px;
        }
        .skip-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .skip-count-chip {
          background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 14px;
          padding: 3px 8px; font-size: 11px; display: flex; align-items: center; gap: 5px; color: var(--slate-mid);
        }

        .round-block { margin-bottom: 18px; }
        .round-heading { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.5px; font-size: 15px; color: var(--ball-yellow); margin-bottom: 6px; }
        .matches-table { display: flex; flex-direction: column; gap: 10px; }
        .match-row {
          display: flex; flex-direction: column; gap: 8px; background: var(--court-navy);
          border: 1px solid var(--court-navy-lighter); border-radius: 6px; padding: 12px 14px; font-size: 13px;
        }
        .match-row-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
        .match-row-bottom { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding-top: 6px; border-top: 1px dashed var(--court-navy-lighter); font-size: 12px; }
        .time-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--court-navy); background: var(--ball-yellow); padding: 3px 8px; border-radius: 4px; }
        .court-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--slate-mid); background: var(--court-navy-lighter); padding: 3px 8px; border-radius: 4px; }
        .group-tag { font-size: 11px; color: var(--slate-mid); text-transform: uppercase; letter-spacing: 0.4px; }
        .matchup { flex: 1; min-width: 200px; padding: 0 4px; }
        .vs { color: var(--slate-mid); font-size: 11px; margin: 0 8px; text-transform: uppercase; }
        .referee-tag { color: var(--slate-mid); }

        .status-pill {
          font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px;
          border: 1px solid; border-radius: 12px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 5px;
        }

        .modal-overlay {
          position: fixed; inset: 0; background: rgba(6, 10, 16, 0.72);
          display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
        }
        .modal-card {
          background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 10px;
          padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .danger-btn {
          background: #E30613; color: #fff; border: none; border-radius: 6px; padding: 8px 16px;
          font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        }
        .danger-btn:hover { background: #c00511; }
        .error-text { color: #FF5A5A; font-size: 12.5px; margin-top: 8px; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 1.4s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

        .filter-row { display: flex; gap: 6px; margin-bottom: 14px; }
        .filter-chip { background: none; border: 1px solid var(--court-navy-lighter); color: var(--slate-mid); padding: 5px 12px; border-radius: 14px; font-size: 12px; cursor: pointer; text-transform: capitalize; }
        .filter-chip.active { border-color: var(--ball-yellow); color: var(--ball-yellow); }

        .scores-list { display: flex; flex-direction: column; gap: 8px; }
        .score-row { background: var(--court-navy); border: 1px solid var(--court-navy-lighter); border-radius: 8px; overflow: hidden; }
        .score-row-main { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; flex-wrap: wrap; font-size: 13px; }
        .round-court { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--slate-mid); }
        .score-summary { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--ball-yellow); }
        .sets-tally { color: var(--slate-mid); font-weight: 500; }

        .score-editor { border-top: 1px solid var(--court-navy-lighter); padding: 14px; background: var(--court-navy-lighter); }
        .score-editor-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .matchup-names { font-weight: 700; font-size: 14px; }
        .games-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .game-row { display: flex; align-items: center; gap: 8px; }

<div class="g2">

async function scLoad(){
  while(SC.loading)await SC.loading;
  const ed=S.ed;SC.canEdit=isAdm()&&!!ed&&!!ed.is_active;
  if(SC.ed&&SC.ed.id===ed.id){SC.ed=ed;SC.emit();return}
  SC.loading=(async()=>{
    await scSettle();
    if(SC.ch){sb.removeChannel(SC.ch);SC.ch=null}
    SC.ed=ed;SC.events=[];SC.status="idle";SC.err="";
    const r=await sb.from("score_events").select("id,data").eq("edition_id",ed.id).order("created_at").order("id");
    if(r.error){SC.err=r.error.message;SC.ed=null}
    else{
      SC.events=(r.data||[]).map(x=>x.data);
      SC.ch=sb.channel("score-"+ed.id).on("postgres_changes",{event:"*",schema:"public",table:"score_events",filter:"edition_id=eq."+ed.id},scRemote).subscribe();
    }
    SC.emit();
  })();
  try{await SC.loading}finally{SC.loading=null}
}
async function scReset(){
  await scSettle();
  if(SC.ch){sb.removeChannel(SC.ch);SC.ch=null}
  SC.ed=null;SC.events=[];SC.canEdit=false;SC.status="idle";SC.emit();
  if(SC.host&&SC.host.parentNode)SC.host.remove();
}
function scAttach(slot){
  if(!SC.host)SC.host=CourtsideScoring.mountScoring(SC.bridge);
  if(SC.host.parentNode!==slot)slot.appendChild(SC.host);
}
V.score=async()=>{
  if(!S.ed)return `<h2>Scoring</h2><p class="m">No edition yet.</p>`;
  await scLoad();
  if(SC.err)return `<h2>Scoring</h2><div class="note">Scoring is not set up yet (${E(SC.err)}). Run scoring.sql in the Supabase SQL editor, then reload.</div>`;
  return `<h2>Scoring, ${E(S.ed.name)}</h2><div id="scSlot"></div>`;
};

// ================= AUCTION (ported from Terrace_Cup___Auction_Room.html) =================
const AU={ev:null,st:null,loaded:null,tab:"live",ch:null};
const auNew=()=>({tournName:"",teams:[],players:[],callOrder:[],history:[],cur:null,settings:{totalPlayers:null,maxPerTeam:null,bidIncrement:100}});
const uid=()=>Math.random().toString(36).slice(2,10);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const auPool=s=>{const c=s.settings.totalPlayers;return c>0?s.players.slice(0,c):s.players};
function auPend(s){
  const pool=auPool(s),ids=pool.map(p=>p.id);
  s.callOrder=(s.callOrder||[]).filter(i=>ids.includes(i));
  const miss=ids.filter(i=>!s.callOrder.includes(i));
  if(miss.length)s.callOrder=s.callOrder.concat(shuf(miss));
  const m=new Map(pool.map(p=>[p.id,p]));
  return s.callOrder.map(i=>m.get(i)).filter(p=>p&&p.status==="pending");
}
const auFull=(s,t)=>{const c=s.settings.maxPerTeam;return !!(c>0&&t.squad.length+1>=c)};
const auMin=s=>{const p=auPool(s);return p.length?Math.min(...p.map(x=>x.base)):0};
function auMax(s,t){const c=s.settings.maxPerTeam,rem=t.budget-t.spent;if(!(c>0))return null;const need=c-(t.squad.length+1);if(need<=1)return rem;return Math.max(0,rem-(need-1)*auMin(s))}
async function auLoad(){
  const r=await sb.from("auctions").select("state").eq("event_id",AU.ev).maybeSingle();
  const d=auNew();AU.st=Object.assign(d,r.data?.state||{});AU.st.settings=Object.assign(auNew().settings,AU.st.settings||{});AU.loaded=AU.ev;
  if(AU.ch)sb.removeChannel(AU.ch);
  AU.ch=sb.channel("auction-"+AU.ev).on("postgres_changes",{event:"*",schema:"public",table:"auctions",filter:"event_id=eq."+AU.ev},p=>{
    const n=p.new;if(!n||n.updated_by===S.user.id)return;AU.st=n.state;if(S.tab==="auc")render()}).subscribe();
}
const auSave=async()=>chk(await sb.from("auctions").upsert({event_id:AU.ev,state:AU.st,updated_by:S.user.id,updated_at:new Date().toISOString()}));
async function au(fn){if(!isAdm()||!live())return;const m=fn(AU.st);if(m)return toast(m);await auSave();render()}

function auLive(s,run){
  if(!s.teams.length||!s.players.length)return `<div class="card m">${run?"Add at least one team and one player in Setup first.":"The auction has not been set up yet."}</div>`;
  const pool=auPool(s),before=JSON.stringify(s.callOrder),pend=auPend(s),cur=pend[0],cap=s.settings.maxPerTeam;
  if(run&&JSON.stringify(s.callOrder)!==before)auSave();
  const teams=s.teams.map(t=>{const full=auFull(s,t),mc=auMax(s,t);return `<div class="tl${full?" full":""}"><div class="th"><b>${E(t.name)}</b><span class="chip pending">${t.squad.length+1}${cap?"/"+cap:""}</span></div><div class="m">Captain: ${E(t.captain||"—")}${full?" · SQUAD FULL":""}</div><div class="st"><div><span>Purse left</span><b>${t.budget-t.spent}</b></div><div><span>Max call</span><b>${mc===null?"—":mc}</b></div></div><div class="sq">${t.squad.map(x=>`<div><span>${E(x.name)}</span><span>${x.price}</span></div>`).join("")||`<span class="m">No players yet</span>`}</div></div>`}).join("");
  const rows=pool.map(p=>{const tm=s.teams.find(t=>t.id===p.soldTo),c=p.status==="sold"?"verified":p.status==="unsold"?"rejected":"pending";return `<div class="pr${cur&&p.id===cur.id?" cur":""}"><span>${E(p.name)}${p.category?` <span class="m">(${E(p.category)})</span>`:""}</span><span class="chip ${c}">${p.status==="sold"?"Sold"+(tm?" — "+E(tm.name):""):p.status==="unsold"?"Unsold":"Available"}</span></div>`}).join("");
  let stage;
  if(!cur)stage=`<h3>All players called</h3><p class="m">See the Results tab for the full breakdown.</p>`;
  else{
    if(!s.cur||s.cur.pid!==cur.id)s.cur={pid:cur.id,bid:cur.base,teamId:(s.teams.find(t=>!auFull(s,t))||{}).id||""};
    const lead=s.teams.find(t=>t.id===s.cur.teamId);
    stage=`<div class="m">${pool.length-pend.length} of ${pool.length} called</div>${cur.photo?`<div style="margin:8px 0">${avatar(cur.photo,96)}</div>`:""}
<div class="pn">${E(cur.name)}</div><div style="color:var(--gold)">${E(cur.category||"")}</div><div class="m">Base value: ${cur.base}</div>`+(run?`
<div class="row"><div><label>Sold to</label><select data-chg="autm">${s.teams.map(t=>`<option value="${t.id}" ${t.id===s.cur.teamId?"selected":""} ${auFull(s,t)?"disabled":""}>${E(t.name)} (purse left: ${t.budget-t.spent})${auFull(s,t)?" — SQUAD FULL":""}</option>`).join("")}</select></div>
<div><label>Current bid</label><div class="bidrow"><input type="number" min="0" value="${s.cur.bid}" data-chg="aubid"><button class="o" data-act="auinc">+ ${s.settings.bidIncrement||100}</button></div></div>
<div class="full"><button data-act="ausell">Sold</button> <button class="o" data-act="auunsold">Unsold</button> <button class="o" data-act="auundo" ${s.history.length?"":"disabled"}>Undo last</button> <button class="o" data-act="aushuf">Shuffle remaining</button></div></div>`
  :`<div class="gold" style="margin-top:10px">Current bid ${s.cur.bid}</div>${lead?`<div class="m">Leading: ${E(lead.name)}</div>`:""}<p class="m">Live updates appear here automatically.</p>`);
  }
  return `<div class="card"><h3>Teams, live</h3><div class="tls">${teams}</div></div>
<div class="card"><h3>Players pool</h3><div class="pool">${rows}</div></div><div class="card stage">${stage}</div>`;
}

      s.input=(cur.trim()?cur.trim()+"\n":"")+add.join("\n");toast(`Added ${add.length} player(s) with their teams`)})},
  drreveal(){if(!DR.playing&&isAdm()&&live())drPlay()},
  drclear(){if(DR.playing)return toast("The reveal is in progress.");if(confirm("Clear the current draw?"))dr(s=>{s.result=null})}
});
// ==============================================================================

// ================= PDF EXPORT (one or many events in a single file) =================
const pdfT=s=>String(s??"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"?");
function pdfFit(doc,t,w){t=pdfT(t);if(doc.getTextWidth(t)<=w)return t;while(t.length>1&&doc.getTextWidth(t+"...")>w)t=t.slice(0,-1);return t+"..."}
function pdfHead(doc,ev,sum,W,extra){
  doc.setFillColor(0,0,0);doc.rect(0,0,W,16,"F");doc.setFillColor(209,18,47);doc.rect(0,16,W,1.2,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(243,207,107);doc.text("TERRACE CUP",12,10.5);
  doc.setFontSize(10);doc.setTextColor(255,255,255);doc.text(pdfT(S.ed.name),W-12,10.5,{align:"right"});
  doc.setFontSize(18);doc.setTextColor(25,25,25);doc.text(pdfFit(doc,ev.name,W-24),12,28);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(110,110,110);doc.text(pdfFit(doc,sum,W-24),12,34);
  if(extra){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(209,18,47);doc.text(pdfT(extra),12,41)}
}
function pdfSlot(doc,s,x,y,w,h){
  const b=y+h/2+1.3;
  if(s.bye){doc.setFont("helvetica","italic");doc.setFontSize(8);doc.setTextColor(150,150,150);doc.text("BYE",x,b)}
  else if(s.name){
    let tw=0;if(s.team){doc.setFont("helvetica","normal");doc.setFontSize(6.5);tw=Math.min(22,doc.getTextWidth(pdfT(s.team))+2);doc.setTextColor(150,110,20);doc.text(pdfFit(doc,s.team,22),x+w,b,{align:"right"})}
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(25,25,25);doc.text(pdfFit(doc,s.name,w-tw),x,b)}
  else if(s.label){doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(25,25,25);doc.text(pdfFit(doc,s.label,w),x,b)}
  else{doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(140,140,140);doc.text(`Winner R${s.from.r} M${s.from.m}`,x,b)}
}
function pdfBracket(doc,rounds,x0,y0,bw,gx,pitch){
  const rowH=6,boxH=rowH*2,cy=[rounds[0].map((_,i)=>y0+i*pitch+pitch/2)];
  for(let k=1;k<rounds.length;k++)cy.push(rounds[k].map((_,j)=>(cy[k-1][2*j]+cy[k-1][2*j+1])/2));
  rounds.forEach((rd,k)=>{
    const x=x0+k*(bw+gx);
    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(209,18,47);doc.text(rname(rd.length),x+bw/2,y0-4,{align:"center"});
    rd.forEach((m,j)=>{
      const c=cy[k][j],top=c-boxH/2;
      doc.setDrawColor(120,120,120);doc.setLineWidth(.25);doc.rect(x,top,bw,boxH);doc.line(x,c,x+bw,c);
      doc.setFillColor(209,18,47);doc.rect(x,top,1.2,boxH,"F");
      doc.setFont("helvetica","normal");doc.setFontSize(6);doc.setTextColor(140,140,140);doc.text("M"+(j+1),x+bw-1,top-.8,{align:"right"});
      pdfSlot(doc,m.a,x+3,top,bw-4.5,rowH);pdfSlot(doc,m.b,x+3,top+rowH,bw-4.5,rowH);
      if(k<rounds.length-1){const mx=x+bw+gx/2;doc.setDrawColor(150,150,150);doc.line(x+bw,c,mx,c);
        if(j%2===0){const c2=cy[k][j+1];doc.line(mx,c,mx,c2);doc.line(mx,(c+c2)/2,x+bw+gx,(c+c2)/2)}}
    });
  });
}
function drPdf(items){
  const {jsPDF}=window.jspdf;let doc=null;
  const np=(w,h)=>{const o=w>h?"l":"p";if(!doc){doc=new jsPDF({unit:"mm",format:[w,h],orientation:o});return}doc.addPage([w,h],o)};
  items.forEach(({ev,r})=>{
    const R=r.rounds,mc=R[0].length,bw=58,gx=14,pitch=17;
    const real=R.flat().filter(m=>!m.a.bye&&!m.b.bye).length,gm=(r.groups||[]).reduce((a,g)=>a+g.fixtures.flat().length,0);
    const sum=`${r.format==="ko"?"Knockout":"Round robin + knockout"} | ${r.players.length} players | ${gm?gm+" group matches, ":""}${real} knockout matches | Teammates in round 1: ${r.same==="yes"?"allowed":"not allowed"} | Drawn ${new Date(r.created).toLocaleString("en-IN")}`;
    if(r.groups){
      const W=297,H=210,colW=87,cx=c=>12+c*(colW+6),top=46,bot=H-10;let ys=[];
      const page=()=>{np(W,H);pdfHead(doc,ev,sum,W,"Group stage");ys=[top,top,top]};page();
      const ln=(c,y,t,bold,size,col,lh)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.setTextColor(...col);doc.text(pdfFit(doc,t,colW),cx(c),y+lh-1);return y+lh};
      r.groups.forEach(g=>{
        const its=[[g.name,1,11,[209,18,47],6.5]];
        g.players.forEach((p,i)=>its.push([`${i+1}. ${p.name}${p.team?"  ("+p.team+")":""}`,0,8.5,[25,25,25],4.3]));
        g.fixtures.forEach((rd,i)=>{its.push([`Matchday ${i+1}`,1,8,[150,110,20],5]);rd.forEach(m=>its.push([`${m[0].name}  vs  ${m[1].name}`,0,8,[25,25,25],4]))});
        const h=its.reduce((a,i)=>a+i[4],0)+4;
        if(h<=bot-top){ // fits in one column: put it in the emptiest column, groups sit side by side
          let c=ys.indexOf(Math.min(...ys));if(ys[c]+h>bot){page();c=0}
          let y=ys[c];its.forEach(i=>{y=ln(c,y,...i)});ys[c]=y+4;
        }else{ // very large group: its own page(s), flowing across columns
          page();let c=0,y=top;
          its.forEach((it,k)=>{if(y+it[4]>bot){if(c<2)c++;else{page();c=0}y=top;if(k>0){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(209,18,47);doc.text(pdfT(g.name)+" (cont.)",cx(c),y+4.5);y+=6}}y=ln(c,y,...it)});
          ys=[bot,bot,bot];
        }
      });
    }
    const W=Math.max(297,24+R.length*bw+(R.length-1)*gx),H=Math.max(210,50+mc*pitch+14);
    np(W,H);pdfHead(doc,ev,sum,W,r.groups?`Knockout bracket: top ${r.advance} ${r.groups.length===1?"from the group":"from each group"} qualify`:"Knockout bracket");
    pdfBracket(doc,R,12,52,bw,gx,pitch);
  });
  return doc;
}
function drDownload(){
  const have=(DR.evs||[]).filter(e=>DR.all[e.id]);
  if(!have.length)return `<div class="card"><h3>Download as PDF</h3><p class="m">Available once a draw has been revealed.</p></div>`;
  return `<form class="card" data-f="drpdf"><h3>Download as PDF</h3><p class="m">Tick one or more events. They are combined into a single PDF.</p>
<div class="chk">${have.map(e=>`<label class="ck"><input type="checkbox" name="ev" value="${e.id}" ${e.id===DR.ev?"checked":""}> ${E(e.name)}</label>`).join("")}</div>
<button class="g">Download PDF</button> <button type="button" class="o" data-act="drall">Select all</button></form>`;
}
Object.assign(F,{
  drpdf(fd){
    const items=fd.getAll("ev").map(Number).map(id=>({ev:(DR.evs||[]).find(e=>e.id===id),r:DR.all[id]})).filter(x=>x.ev&&x.r);
    if(!items.length)return toast("Select at least one event with a draw.");
    if(!window.jspdf)return toast("The PDF tool could not load. Check your internet connection and refresh.");
    const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    drPdf(items).save(`terrace-cup-${S.ed.year}-draw${items.length===1?"-"+slug(items[0].ev.name):"s"}.pdf`);
    toast(`Downloaded ${items.length} draw${items.length>1?"s":""}`);
  }
});
Object.assign(A,{drall(){document.querySelectorAll("form[data-f=drpdf] input[name=ev]").forEach(c=>c.checked=true)}});
// ==============================================================================

document.addEventListener("submit",async e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const b=e.target.querySelector("button");if(b)b.disabled=true;
  try{await F[f](new FormData(e.target))}catch(err){toast(err.message)}finally{if(b)b.disabled=false}});
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(a){e.preventDefault();A[a.dataset.act](a.dataset.id);return}
  const t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;render();return}
  const m=e.target.closest("[data-mode]");if(m){e.preventDefault();S.mode=m.dataset.mode;S.msg="";render()}});
document.addEventListener("change",e=>{const k=e.target.dataset.chg,v=e.target.value;
  if(k==="ed"){S.ed=S.eds.find(x=>x.id===+v);AU.ev=null;AU.loaded=null;DR.ev=null;try{localStorage.setItem("tc_ed",S.ed.id)}catch{}render()}
  else if(k==="auev"){AU.ev=+v;AU.loaded=null;render()}
  else if(k==="drev"){DR.ev=+v;render()}
  else if(k==="drfmt")document.querySelectorAll(".grpf").forEach(x=>x.style.display=v==="rrko"?"":"none");
  else if(k==="autm")au(s=>{s.cur.teamId=v});
  else if(k==="aubid")au(s=>{s.cur.bid=parseFloat(v)||0})});
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&!S.user)setTimeout(load,0)});
load();
</script>
